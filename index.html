<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0B7480">
<title>보아르 페어 가이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
/* Layout: 토스 스타일 — 연회색 바탕 위 흰 카드, 큰 굵은 제목, 파란 포인트, 테두리 없음 */
:root{
  color-scheme:light;
  --bg:#F2F4F6; --surface:#FFFFFF; --ink:#191F28; --sub:#333D4B; --muted:#8B95A1; --line:#F2F4F6; --line2:#E5E8EB;
  --accent:#3182F6; --accent-ink:#FFFFFF; --accent-soft:#E8F3FF; --accent-deep:#1B64DA;
  --staff-bg:#FFF6E5; --staff-fg:#B25E00; --warn-bg:#FFEEEE; --warn-fg:#E42939;
  --hl:#FFF0A8; --shadow:none;
  --f-ui:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --r:20px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.6;margin:0;letter-spacing:-.01em;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit}
button:active{transform:scale(.985)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface)}
header.top .wrap{padding-block:12px 14px;display:grid;gap:10px}
.brand{display:flex;align-items:center;min-width:0}
.brand .home{background:none;border:0;padding:0;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:left}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand .home>span>span{font-size:13px;color:var(--muted);margin-left:2px}
.brand b{color:var(--ink)}
.logo{width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:16px;padding:13px 44px 13px 16px;border-radius:14px;border:0;background:var(--bg);color:var(--ink);outline:none}
.search input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.search input::placeholder,.qfilter input::placeholder{color:#B0B8C1}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:#D1D6DB;color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:14px;line-height:22px;padding:0}

main .wrap{padding-block:20px 56px;display:grid;gap:28px}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.02em}
h2.sec{font-size:19px;font-weight:700;color:var(--ink)}
.muted{color:var(--muted)}
.small{font-size:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;background:var(--surface);color:var(--sub);border-radius:999px;padding:9px 15px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}

/* list */
.cat{display:grid;gap:12px}
.plist{display:grid;gap:0;background:var(--surface);border-radius:var(--r);padding:6px 0;overflow:hidden}
.prow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:14px 20px;cursor:pointer}
.prow + .prow{box-shadow:inset 0 1px 0 var(--line)}
.prow .n{font-weight:600;font-size:17px;min-width:0;color:var(--ink)}
.prow .p{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;color:var(--sub)}
.prow .t{grid-column:1 / -1;font-size:14px;color:var(--muted);min-width:0}
.prow:hover{background:#F9FAFB}
.plist.lines .prow .t{color:var(--sub);font-size:15px}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:0;border-radius:18px;padding:16px 18px;text-align:left;cursor:pointer;display:grid;gap:4px}
.tile b{font-size:16px;font-weight:700}
.tile span{font-size:13.5px;color:var(--muted)}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);color:var(--warn-fg);border-radius:var(--r);padding:16px 18px;border:0;width:100%;text-align:left;cursor:pointer;font-size:15px}

/* product */
.back{border:0;background:none;padding:2px 0;color:var(--muted);font-weight:600;font-size:15px;cursor:pointer;justify-self:start}
.phead{display:grid;gap:8px}
.phead .catn{font-size:14px;color:var(--accent);font-weight:700}
.phead h1{font-size:26px;line-height:1.3;font-weight:800}
.phead .tag{color:var(--sub);font-size:15.5px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fact{background:var(--surface);border-radius:8px;padding:5px 10px;font-size:13.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.fact b{font-weight:700;color:var(--ink)}
.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,120px));z-index:4;background:var(--surface);margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding:0 max(12px,env(safe-area-inset-left,0px));display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;box-shadow:inset 0 -1px 0 var(--line2)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:14px 10px 12px;font-weight:600;font-size:15.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:700}
.tab .cnt{font-weight:600;font-size:13px;color:var(--accent);margin-left:3px}

.card{background:var(--surface);border:0;border-radius:var(--r);padding:22px 20px;display:grid;gap:14px}
.card h3{font-size:18px;font-weight:700}
.feat{display:grid;gap:16px}
.feat div{display:grid;gap:4px}
.feat b{font-size:16px;font-weight:700}
.feat p{margin:0;color:var(--sub);font-size:15px;white-space:pre-line}
ul.tell{margin:0;padding-left:20px;display:grid;gap:8px;color:var(--sub)}
.caution{background:var(--accent-soft)}
.caution h3{color:var(--accent-deep)}
.caution ul.tell{color:#1E3A60}

dl.kv{margin:0;display:grid}
dl.kv div{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
dl.kv div:first-child{border-top:0;padding-top:0}
dl.kv dt{color:var(--muted);font-size:14.5px}
dl.kv dd{margin:0;white-space:pre-line;font-variant-numeric:tabular-nums;min-width:0;color:var(--ink);font-size:15px}
dl.kv .sub{grid-template-columns:1fr;padding-top:18px}
dl.kv .sub dt{color:var(--accent);font-weight:700;font-size:14px}
.txt{white-space:pre-line;margin:0;color:var(--sub)}
.tblw{overflow-x:auto;border-radius:14px;background:var(--bg)}
table{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:13px;white-space:nowrap}
tr:last-child td{border-bottom:0}
.tcap{font-size:14px;font-weight:700;margin:4px 0 8px}

/* QA */
.qa{display:grid;gap:10px}
details.q{background:var(--surface);border-radius:18px}
details.q>summary{list-style:none;cursor:pointer;padding:18px 48px 16px 20px;position:relative;font-weight:600;font-size:16px;line-height:1.5}
details.q>summary::-webkit-details-marker{display:none}
details.q>summary::after{content:"";position:absolute;right:22px;top:25px;width:8px;height:8px;border-right:2px solid #B0B8C1;border-bottom:2px solid #B0B8C1;transform:rotate(45deg);transition:transform .15s}
details.q[open]>summary::after{transform:rotate(-135deg);top:28px}
details.q .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--bg);color:#6B7684}
.pill.staff{background:var(--staff-bg);color:var(--staff-fg)}
.pill.prod{background:var(--accent-soft);color:var(--accent-deep)}
.ans{padding:0 20px 20px;display:grid;gap:12px}
.part{display:grid;gap:4px}
.part .lab{font-size:13px;font-weight:700;color:var(--accent)}
.part p{margin:0;white-space:pre-line;color:var(--sub);font-size:15.5px}
.staff{background:var(--staff-bg);color:var(--staff-fg);border-radius:12px;padding:12px 14px;font-size:14.5px}
.staff b{display:block;font-size:13px;margin-bottom:2px}
.staff p{margin:0;white-space:pre-line}
.media{font-size:13px;color:var(--muted)}
.checks{background:var(--warn-bg);color:var(--warn-fg)}
.checks ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
details.fold>summary{cursor:pointer;font-weight:700}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.empty{color:var(--muted);text-align:center;padding:32px 0}
.res{display:grid;gap:10px}
.ritem{background:var(--surface);border:0;border-radius:18px;padding:16px 20px;text-align:left;cursor:pointer;display:grid;gap:6px;width:100%}
.ritem .rq{font-weight:700;font-size:16px}
.ritem .rs{font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.qfilter input{width:100%;font:inherit;font-size:16px;padding:13px 16px;border-radius:14px;border:0;background:var(--surface);color:var(--ink);outline:none}
.qfilter input:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.psearch{margin-top:-4px}
.cmp{background:var(--surface)}
.cmp th:first-child,.cmp td:first-child{position:sticky;left:0;background:var(--surface);font-weight:600;color:var(--muted);font-size:13px;min-width:84px}
.cmp th{background:var(--surface);color:var(--ink);font-size:14px}
.cmp th button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;cursor:pointer;text-align:left}
.cmp td{border-bottom-color:var(--line)}

/* 판매 화법 */
.concept{font-size:22px;font-weight:800;line-height:1.4;letter-spacing:-.03em;text-wrap:balance;margin:0}
.pain{font-size:15px;color:var(--sub);background:var(--bg);border-radius:12px;padding:12px 14px}
.pain b{color:var(--ink);font-weight:700;margin-right:4px}
.hero{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hero div{background:var(--accent-soft);border-radius:14px;padding:14px;display:grid;gap:4px;min-width:0}
.hero b{font-size:15.5px;color:var(--accent-deep);font-weight:700}
.hero span{font-size:14px;color:#3D5A80}
ol.points{margin:0;padding:0;list-style:none;counter-reset:pt;display:grid;gap:16px}
ol.points li{counter-increment:pt;display:grid;grid-template-columns:30px 1fr;gap:3px 12px}
ol.points li::before{content:counter(pt);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700}
ol.points b{font-size:16px;font-weight:700}
ol.points span{font-size:15px;color:var(--sub)}
.persona{display:grid;gap:14px}
.persona div{display:grid;gap:6px}
.persona .who{justify-self:start;font-size:13px;font-weight:700;color:var(--accent-deep);background:var(--accent-soft);border-radius:6px;padding:2px 8px}
.persona q{font-size:16.5px;font-weight:600;quotes:"“" "”";color:var(--ink)}
.note{font-size:14px;background:var(--staff-bg);color:var(--staff-fg);border-radius:10px;padding:8px 12px;margin-top:2px}
.top5{display:grid}
.top5 div{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.top5 div:first-child{border-top:0;padding-top:0}
.top5 .qq{font-weight:700;font-size:16px}
.top5 .aa{white-space:pre-line;color:var(--sub);font-size:15px}
.plus{background:var(--accent);color:#fff}
.plus h3{font-size:13px;letter-spacing:.06em;font-weight:700;opacity:.85}
.plus .txt{color:#fff;font-size:16px;font-weight:600}
.rules{display:grid;gap:12px}
.rules div{display:flex;gap:10px;align-items:baseline}
.rules div::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;transform:translateY(-3px)}
.rules b{font-size:16px;font-weight:600}
footer{font-size:13px;color:var(--muted);display:grid;gap:4px;padding-top:4px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="theme">
:root{--bg:#F2F3F5;--surface:#FFFFFF;--ink:#252A31;--sub:#454C55;--muted:#959BA3;--line:#EFF0F2;--line2:#E1E4E8;
--accent:#5F8F6F;--accent-soft:#E8F1EA;--accent-deep:#3F6E50;--hl:#F3E7B6}
.hero span{color:#3F5A47} .caution ul.tell{color:#35513F}
.pill{color:#959BA3} .prow:hover{background:#F2F3F5}
.search input::placeholder,.qfilter input::placeholder{color:#959BA3}
.search .clear{background:#E1E4E8}
details.q>summary::after{border-color:#959BA3}
</style>

</head><body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <button class="home" id="homeBtn" type="button" aria-label="처음으로">
        <span class="logo" aria-hidden="true">V</span>
        <span><b>보아르 페어 가이드</b> <span>직원용 · 12개 제품</span></span>
      </button>
    </div>
    <div class="search">
      <input id="q" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="고객 질문을 검색 (예: 유리젖병, 전기세, 세척)" aria-label="전체 검색">
      <button class="clear" id="qclear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </div>
  </div>
</header>

<script>
const DATA = {"products": [{"id": "agaon", "name": "아가온 분유포트", "full": "보아르아가온분유포트", "cat": "feed", "catName": "수유·이유식", "tag": "3L 유리포트 · 10ml 단위 정량 출수 · 스마트 분유(100℃→45℃ 보온)", "caution": ["쿨링 기능은 없습니다. 100℃에서 45℃까지 자연 냉각에 1L 약 2시간, 3L 약 3시간 30분이 걸립니다.", "출수 버튼은 잠금 버튼을 눌러 해제한 뒤에만 작동합니다(안전 설계).", "잔수통(900ml) 만수 알림은 없습니다. 주기적으로 비워야 합니다."], "checks": [], "price": "₩129,000", "model": "VBNM-002WH", "color": "화이트(A01821)", "release": "25년 9월", "wired": "유선", "parts": "본품, 사용설명서", "basic": [["제조국", "중국"], ["소재(재질)", "유리제, 폴리프로필렌, 스테인레스제, 고무제\n[상세 소재]\n출수관 : PP , 출수구: 실리콘 / 유리포트 : 붕규산 내열 유리 / 가열판, 뚜껑: SUS304"], ["사이즈", "340 x 182 x 302 (mm)"], ["상세사이즈", "전원선 길이: 100cm / 유리포트 높이(뚜껑 제외): 약 24.5cm\n사용 가능(젖병,컵 등) 높이 :"], ["제품 박스 사이즈", "가로: 360mm, 세로: 220mm, 높이: 355mm"], ["무게", "2.8 kg"], ["편도 / 왕복배송비", "3,000원 / 6,000원"], ["소비전력", "1200W"], ["정격입력", "AC 220V, 60Hz"], ["전원", "일체형 전원코드"]], "spec": [["물 용량", "3000ml"], ["연마제 사용 여부", "첫 사용 전 연마제 제거 후 사용 권장"], ["배수통 용량", "900ml"], ["식기세척기 사용 여부", "불가"], ["물 끓는 시간", "(28℃ 생수 3000ml 기준) 약 18분"], ["사용 및 보관 온도", "≤80%, 통풍이 양호한 실내"], ["모드", "분유/중탕/가열 모드, 스마트분유, 잠금, 출수"], ["세척 가능 온수", "상온"], ["온도 조절범위", "분유,중탕: 35~90℃ (1℃ 단위조절 가능)\n가열: 100℃"], ["물 없이 작동 유/무", "권장 하지 않음\n(내부 과열로 135도 이상 인식시 멈춤)"], ["출수 조절범위", "10~300ml\n\n(짧게 눌러 10ml / 길게 눌러 50ml 조절 가능)"], ["소음", "N/A (가열 시 물 끓는 소음 발생)"], ["메모리기능", "메뉴 및 출수량 저장 (코드선 분리시 리셋)"], ["대기 전환", "2분\n(유리포트 분리시 E1 표시 후 2분뒤 리셋)"], ["보온 작동 시간", "(분유/중탕/스마트분유) 영구 보온 가능"]], "usage": [{"title": "제품 명칭 및 사용 방법", "items": [["", "※ 사용하기 전 주의사항\n ·  제품을 처음 사용할 경우, 키친타월에 식용유를 소량 묻혀 스테인리스 부품의 표면을 부드럽게 닦아 연마제를 제거해 주십시오.\n ·  중성세제로 깨끗이 세척한 후, 물을 2~3회 끓이고 버린 후 사용해 주십시오.\n ·  가열 후 출수 기능을 3~4회 배출해 주십시오.\n ·  사용 전에는 반드시 설명서의 세척 방법과 사용 방법을 확인해 주십시오\n* 유리포트 주의 스티커: 냉장고, 전자레인지, 식기세척기 사용 금지"], ["", "1. 유리 포트 준비\n·  유리 포트 뚜껑을 열고 500-3000ml의 식음 가능한 물을 넣습니다.\n   ※ 뚜껑 하단에 부착된 스크래치 방지용 보호 필름을 제거한 후 사용해 주십시오.\n   ※ 유리 포트를 본체에 연결하기 전에 연결 단자에 물기가 없는지 확인한 후 연결해 주십시오."], ["", "2. 전원 연결\n·  전원 코드를 연결한 후, 전원/조명 버튼을 짧게 눌러 전원을 켭니다.\n   ※ 유리 포트가 연결되지 않으면 온도 표시창에 E1 표시와 함께 버튼이 동작하지 않습니다. 유리 포트를 연결해 주십시오."], ["", "3. 온도 및 출수량 표시\n ·  전원이 연결되면 온도 표시창에 실제 수온이 나타나고, 출수량 표시에는 설정된 출수량이 표시됩니다.\n※ 대기 상태에서 전원/조명 버튼을 길게 누르면 무드등이 켜지며, 다시 길게 누르면 꺼집니다."], ["", "4. 출수량 조절 기능\n ·  기본 출수량은 300ml입니다.\n ·  출수량 조절 버튼을 누르면 출수량 표시가 5회 점멸하며, - 또는 + 버튼을 눌러 출수량(10~300ml)을\n    조절합니다.\n ·  -/+ 버튼을 길게 누르면 50ml씩, 짧게 누르면 10ml씩 조절됩니다.\n ·  조절을 하지 않으면 5회 점멸 후 설정이 고정됩니다."], ["", "5. 잠금 버튼 및 출수\n ·  잠금 버튼을 누르면 출수 조명이 켜지고 출수 버튼이 약 5초간 점등됩니다.\n    이때 출수 버튼을 누르면 설정된 출수량만큼 물이 출수됩니다.\n ·  출수 전 배수통이 연결되어 있는지 확인해 주십시오.\n ·  배수통의 용량은 900ml이며, 주기적으로 비워주십시오."], ["", "6. 스마트 분유 기능\n ·  스마트 분유 버튼을 누르면 100℃까지 가열한 다음 45℃로 보온 상태로 전환됩니다.\n ·  보온 상태가 설정되면 지속적으로 보온 기능이 유지됩니다.\n[테스트 내용 공유 : 가열중인 경우 스마트분유 LED가 점멸상태이며, 보온으로 전환시 점등상태로 변경됩니다. ('보온'LED 점등 상태로 보여집니다.)]"], ["", "7. 메뉴 버튼 기능\n ·  메뉴 버튼을 누르면 설정된 온도까지만 가열됩니다.\n ·  메뉴 버튼을 누를 때마다 설정된 메뉴가 3회 점멸하며, 이때  -/+ 버튼으로 원하는 온도를 설정할 수 있습니다. 점멸이 끝나면 설정한 온도로 작동됩니다.\n ·  -/+ 버튼을 짧게 누르면 1℃ 단위, 길게 누르면 5℃ 단위로 조절 가능합니다.\n ·  분유 메뉴의 기본 설정은 45℃ (35~90℃ 조절 가능) / 가열 후 보온 유지\n ·  중탕 메뉴의 기본 설정은 55℃ (35~90℃ 조절 가능) / 가열 후 보온 유지\n ·  가열 메뉴에서는 온도 조절이 불가하며, 가열 완료 후 자동으로 종료됩니다.\n ·  제품 디스플레이는 최대 99℃까지 표시됩니다. 물 온도가 100℃에 도달하면 자동으로 보온 모드로 전환되거나 작동이 종료됩니다.\n   ※ 유리 포트가 분리된 경우 E1 에러 코드가 표시되며, 2분 이내에 재장착하면 이전 설정으로 작동되고,  2분이 지나면 모든 설정이 리셋됩니다."]], "notes": []}], "clean": [{"title": "세척 방법", "items": [["", "·  유리 포트 하단부, 본체, 전원코드 부분에 물이나 세척제를 직접 뿌리지 마십시오. (※ 감전, 화재의 원인이 될 수 있습니다.)\n ·  제품이 건조한 상태에서 식용유를 키친타월에 묻혀 스테인리스 부품을 닦아주십시오.\n ·  사용 전 뚜껑, 유리 포트 내부를 따뜻한 물과 주방용 중성세제를 이용하여 부드러운 수세미로 닦아 주십시오.\n ·  거친 연마제나 치약과 같은 부식성 제품, 그리고 철 수세미를 사용하면 제품이 손상될 수 있으므로 절대로 사용하지 말아 주십시오.\n    (※ 철 수세미, 녹색 수세미, 탄 냄비를 세척한 수세미는 사용하지 마십시오.)\n ·  사용 후 매번 제품을 청소해 주십시오.\n ·  유리 포트 외부, 받침대는 부드러운 천, 면, 헝겊 등으로 외부에 남아있는 물기를 깨끗이 닦아 주십시오.\n ·  깨끗이 닦지 않거나  바닥에 물기를 제거하지 않고 사용하게 되면 석회 성분으로 변색 또는 얼룩이 생깁니다."]], "notes": []}], "features": [["독보적인 위생 출수 시스템", "출수관에 잔수는 모두 자동 배출하고 늘 깨끗한 물로만 출수됩니다. (고인물이 배수통으로 자동 배수)"], ["원터치", "원하는 물의 양을 간편하게 맞춰 버튼 하나로 분유/중탕/가열까지 가능"], ["분리형", "유리포트가 분리 가능해 위생적으로 사용 가능, 배수통 분리가 가능하여 간편 세척 가능"], ["스마트 분유 기능", "100℃까지 가열(3분 유지) 후 45℃로 보온 상태로 전환되어 영구 보온 상태로 유지"], ["스마트 메모리 기능", "매번 출수량을 설정할 필요 없이 마지막으로 설정한 물의 온도와 출수량을 기억해 줍니다"]], "errors": [], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "전원이 켜지지 않습니다.", "a": [["확인사항", "→ 전원 코드와 플러그를 다시 확인하고, 콘센트에 올바르게 연결해 주십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "물이 끓지 않습니다.", "a": [["확인사항", "→ 물의 양을 500ml~3000ml 이하로 조절해 주십시오. 그리고 뚜껑이 제대로 닫혀 있는지 확인하십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "이상한 냄새가 납니다.", "a": [["확인사항", "→ 제품이 새상품이거나, 장시간 사용하지 않은 경우 내부에 먼지가 쌓였을 수 있습니다. 제품을 청소하고 충분히 통풍시켜 주십시오.\n→  물의 양이 너무 낮은 상태에서 오랫동안 끓이는 경우 냄새가 발생할 수 있으니, 물을 교체해 주십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "가열판에 얼룩이 생깁니다.", "a": [["제거 방법", "1. 식초와 물을 1:1 비율로 섞습니다.\n2. 혼합한 용액을 유리 포트에 붓습니다.\n3. 가열하여 얼룩을 제거합니다.\n4. 용액을 버리고 깨끗한 물로 여러 번 헹굽니다.\n5. 유리 포트를 완전히 건조시킵니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "보온 기능이 작동하지 않습니다.", "a": [["확인사항", "→ 설정되지 않았거나, 전원이 꺼졌을 수 있습니다.\n→ 물의 양이 500ml 이상인지 확인해 주십시오.\n→ 유리 포트가 분리 된 상태에서 2분을 초과하면 설정이 리셋됩니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "물을 끓이는데 너무 오래 걸립니다.", "a": [["확인사항", "→ 일반적인 포트에 비해 용량이 크기 때문에 가열 시간이 더 걸릴 수 있습니다. 물량을 줄이면 가열 시간을 단축할 수 있습니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "보온 온도보다 높게 끓습니다.", "a": [["확인사항", "→ 스테인리스 가열판의 잔열로 인해 온도가 소폭 상승할 수 있습니다. 설정 온도 이후 일정 시간이 지나면 최종적으로 설정 온도에 도달합니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "제품 하단에 물이 흘러나옵니다.", "a": [["확인사항", "→ 배출통에 물이 가득 차 있는지 확인해 주시고, 필요 시 비워주십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "가열 메뉴 또는 스마트 분유 기능 사용 시, 제품 디스플레이가 99℃에서 멈추고 100℃로 표시되지 않습니다.", "a": [["확인사항", "→ 본 제품 디스플레이는 최대 99℃까지만 표시됩니다. 실제 물 온도가 100℃에 도달하면, 디스플레이는 99℃로 표시된 상태에서 자동으로 가열이 종료되고 보온 모드로 전환되거나 작동이 중지됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "가열모드 사용시 100℃가 안되어 인입되는 경우", "a": [["대응", "→ 제품 디스플레이는 최대 99℃까지 표시됩니다. 물 온도가 100℃에 도달하면 자동으로 보온 모드로 전환되거나 작동이 종료됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "설정한 출수량과 다르게 출수되는 경우", "a": [["대응", "출수관의 잔수나 공기로 인해 간헐적으로 오차가 나타날 수 있음. 사용시마다 빈번하게 나타나는 현상인지 확인 필요"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "출수된 물의 온도가 설정온도보다 낮아요", "a": [["대응", "→ 젖병의 재질, 크기, 분유 등의 영향으로 출수되는 물의 온도는 설정온도와 ±5% 차이가 있을 수 있습니다 ."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "고온 출수 시 설정한 출수량과 다르게 출수되는 경우", "a": [["대응", "→ 해당 제품은 40℃ 기준에서 질량(무게) 기반으로 출수량을 감지하도록 설계되어 있습니다.\n고온수(100℃) 출수 시에는 물의 밀도 변화와 고온 환경의 영향(기포 등), 출수관의 상태에 따라 출수량 차이가 발생할 수 있습니다. 이로 인해 설정값과 실제 출수량 사이에 다소 차이가 발생할 수 있으며, 이는 제품의 감지 방식 특성에 따른 현상으로 불량은 아닙니다.\n제품의 불량인지 보다 정확한 계량이 필요하신 경우, 40℃ 기준 온도에서 테스트를 권장드립니다"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "스마트분유모드시 100도 가열된 상태로 몇분간 지속되나요?", "a": [["대응", "→ 100℃ 도달 후 약 3분간 유지하여 염소를 제거한 뒤, 설정된 보온 온도로 전환됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "쿨링기능이 있나요?? 100℃ 가열 후 45℃까지 어느 정도 시간이 소요되나요 ?", "a": [["대응", "→ 쿨링 기능은 없으며, 시험 결과 물 1,000ml, 주변온도 26-28℃ 기준 100℃ 가열 후 45℃로 식기까지 약 2시간 정도의 시간이 소요됩니다. 자연 냉각 시간은 외부 온도, 물의 양에 따라 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "최대 용량으로 100℃ 끓은 후 45℃ 식는 시간", "a": [["대응", "→ 온/습도: 27℃, 47% 환경에서 3000mL: 약 3시간 30분"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "용량 별 100℃ 끓은 후 45℃ 식는 시간", "a": [["대응", "→ 온/습도: 26℃, [45% 환경에서 800mL: 약 1시간 30분 / 1000mL: 약 2시간]"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "사용할 때 마다 잠금을 해제 해야 하나요 문의시", "a": [["대응", "→ 안전상 설계로 출수 버튼은 잠금 버튼을 눌러 해제한 후에만 작동됩니다. 다만 출수 기능을 제외한 그 외 기능 버튼은 잠금 해제 없이도 조작 가능합니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "영구 보온이라면서 온도 내려갑니다. 자꾸 다시 끓여놔야해요.", "a": [["대응", "→  가열모드는 보온으로 전환되지 않습니다. 분유/중탕/스마트분유 모드로 사용했는지 확인 해주세요.\n→ 유리 포트가 분리된 경우 E1 에러 코드가 표시되며, 2분 이내에 재장착하면 이전 설정으로 작동되고,  2분이 지나면 작동이 리셋됩니다. 2분 이내 재결합 했을 때에도 리셋되는지 확인해주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "분유/중탕 모드에 차이점이 있나요?", "a": [["대응", "→ 기본설정 온도만 다를 뿐 차이는 없음. 기본 온도 또는 원하는 온도를 설정하여 사용하시면 됨."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "출수구가 실리콘+PP 재질이라고 답변된거 확인했는데, 뜨거운물 출수할때 환경호르몬 등 생길 문제는 없을까요?", "a": [["대응", "→ 아가온분유포트의 내부 출수관과 출수구는 실리콘과 PP 소재로 제작되었으며, 가열 및 섭취 시 직접 닿는 모든 부위는 식품 검역 절차를 거쳐 안전하게 입고된 제품입니다. 안심하고 사용하셔도 되는 상품입니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "잔수통이 가득찼을때 알림기능이 있나요?", "a": [["대응", "→ 잔수통 만수 알림 기능은 없습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "배수통에 물이 안모이는 경우", "a": [["대응", "→ 초기 배송시 장착되는 주황색 출수구 마개를 제거했는지 확인 필요"]], "notes": [], "media": true}, {"group": "제품 ·사용 관련", "q": "출수구(주황색) 마개 용도 문의시", "a": [["대응", "→ 주황색 출수구 마개는 별도 용도가 없어, 보관시 재사용하실게 아니라면 폐기하셔도 됩니다."]], "notes": [], "media": true}, {"group": "제품 ·사용 관련", "q": "유리포트 상단 테두리 (울퉁불퉁) 외관 불량으로 인입 시", "a": [["대응", "→ 당사 붕규산 유리 포트는 수작업으로 생산됩니다. 상단 테두리가 굴곡진 상태는 수작업으로 인해 발생한 것으므로 이가 나가거나 기포가 있는 상태가 아니라면 사용에는 문제가 없사오니 안심하고 사용해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "유리 포트 손잡이가 돌아가요.", "a": [["대응", "→ 포트는 수작업으로 생산된 통 유리이기 때문에 나사로 고정시 파손의 우려가 있어 약간의 유격이 있게 제작 되었습니다. 손잡이 흔들림은 있을 수 있지만 사용 중 빠지진 않으므로 안심하고 사용해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "유리포트 뚜껑의 파란 보호 필름 스크레치 및 가운데 구멍으로 인입되는 경우", "a": [["대응", "→ 가운데 구멍은 나사 조립을 위해 뚫렸으며, 제거시 스크레치가 날 수 있어 부착된 상태로 포장되었습니다.\n→ 스크레치는 보호 필름을 제거한 상태에서 남아있는지 확인 부탁드립니다."]], "notes": [], "media": true}, {"group": "제품 ·사용 관련", "q": "버튼 터치 소리 무음이나 조절 가능한가요?", "a": [["대응", "→ 버튼 조작음은 음량 조절 및 무음 설정이 불가합니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "물 잔여량 표시 기능(물부족 알람) 기능 있나요?", "a": [["대응", "→ 물 부족시 별도 알림은 없으나, 내부 과열로 135℃ 이상 과열 감지시 작동이 멈추도록 설계되어 있습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "수유등 기능 밝기조절이나 끄고 켜기 설정 가능한지 궁금합니다.", "a": [["대응", "→ 대기 상태에서 전원버튼을 길게 눌러 조명을 켜고 끌 수 있으며, 출수 시 켜지는 무드등은 밝기 조절이나 on/off 설정이 불가합니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "45℃는 뜨겁지않나요? 보통 조리원에서도 물 온도 37~40℃라고해서요", "a": [["대응", "→ 분유마다 권장되는 물 온도가 다를 수 있으므로, 사용하시는 분유의 조유 방법을 먼저 확인해 주세요.\n 해당 제품은 모드별 45℃보다 낮은 35℃부터도 온도 설정이 가능하므로, 사용하시는 분유의 권장 온도에 맞춰 설정하여 사용해 주시면 됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "스마트 분유모드 설정했을때 보온 온도 40도 어떻게 설정하나요?", "a": [["대응", "→ 스마트 분유 모드에서 물 온도를 40℃로 설정하시려면 아래 방법으로 설정해 주세요.\n① 스마트 분유 버튼을 눌러주세요.\n② 메뉴에서 ‘분유’를 선택해 주세요.\n③ ‘-’ 버튼을 눌러 원하는 온도인 40℃로 설정해 주세요.\n\n스마트 분유 모드는 물을 100℃까지 끓인 후 설정하신 온도인 40℃로 보온하여 사용하는 방식입니다.\n40℃로 설정하시면 물이 끓은 후 40℃로 보온됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "티백 또는 차를 넣고 끓이는 용도로 사용 가능한지 문의시", "a": [["대응", "→ 물만 끓이는 용도로 사용 가능. 티백 또는 차를 넣은 컵에 물을 따라 음용토록 안내"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "첨부터 물 끓이면 너무 오래걸려서 물이 절반정도 남은 상태에서 계속 보충 해줘서 끓여도되나요", "a": [["대응", "→물이 절반 정도 남았을 때 물을 보충하여 사용하셔도 됩니다. 물 온도가 내려가면 설정된 온도로 다시 가열하여 보온합니다.\n다만, 분유 조제용 물은 위생적인 사용을 위해 물을 보충한 후 스마트분유 버튼을 다시 눌러 100℃에서 3분간 끓인 뒤, 적정 온도로 식혀 사용해 주세요."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "첫 사용시 내부관을 세척하는 방법이 있을까요?", "a": [["대응", "→ 물을 끓이신 후 출수하여 출수관을 세척할 수 있습니다.\n→ 뜨거운 물에 구연산을 9:1 비율로 희석 후 출수하실 수도 있습니다. 구연산 이용시 깨끗한 물로 여러번 출수하여 관에 남은 잔수를 배출해 주세요."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "내부 출수관 세척 방법 문의시", "a": [["대응", "→ 식초 또는 구연산을 물에 희석 후 출수 버튼을 눌러 출수관에 5-10분 정도 머물도록 합니다. (구연산은 반드시 물에 완전히 녹인 액체 상태로 사용해야 합니다.)\n→ 이후 깨끗한 물을 넣어 여러번 출수하여 출수관에 남은 물을 배출시켜 관리해 주세요."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "세척주기는 어떻게 되나요?", "a": [["대응", "→ 위생적인 사용을 위해 가급적 사용 직후 세척하시는 것을 권장드리며, 최소 주 2~3회 이상 정기적으로 세척하여 관리해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "연마제 제거 방법 문의시", "a": [["대응", "1. 새 제품을 구매한 후 물로 씻지 않은 상태에서 키친타월에 식용유를 묻혀 가열판 및 스테인리스부분을 구석구석을 닦아줍니다. (약 3~4회 반복)\n2. 베이킹소다를 소량 넣고 물을 끓인 뒤, 약 5분 정도 그대로 둡니다.\n3. 물을 버리고 키친타월에 식초를 묻혀 구석구석 닦아내 주세요.\n4. 위 단계를 모두 거친 후 마지막으로 깨끗한 물로 충분히 헹궈 세척해 주세요."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "전기포트 가열판에 하얀색/갈색 반점 얼룩이 생겨 문의하는 경우", "a": [["원인", "→ 물에 들어있는 칼슘, 마그네슘 같은 미네랄 성분이 끓고 증발하면서 하얀 반점/얼룩처럼 보입니다.\n→ 미네랄 가루가 쌓이면서 남아 있는 잔열로 인해 갈색으로 변하게 됩니다."], ["대응", "1. 구연산을 소량 넣고 5~10분 정도 가열모드로 사용 후, 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": true}, {"group": "세척 · 보관", "q": "스테인레스 표면의 녹으로 인입되는 경우", "a": [["원인", "→ 물에 포함된 미네랄 성분이 스테인리스 표면에 흡착된 뒤 이 부분이 완전히 제거되지 않아, 제품을 계속 사용하면서 해당 부위가 그을림(갈색)처럼 보이는 흔적이 생길 수 있습니다. 이는 녹이 아니라 미네랄 잔여물로 인한 변색 현상일 가능성이 높습니다."], ["대응", "→ 실제 녹이라면 세척을 해도 제거가 되지 않는 부분이기에 아래 세척 방법을 통해 지워지는지 확인해주시길 바랍니다.\n→ 세척 방법\n① 키친타월에 식초를 충분히 적셔 오염 부위에 5~10분 정도 붙여 방치, 이후 깨끗한 물과 부드러운 스펀지로 닦아 주세요.\n② 만약, 잔여 흔적이 남아 있는 경우, 뜨거운 물 100ml에 구연산 5g을 넣어 가열모드로 사용 후 전원을 끄고 약 1시간 가량 방치한 뒤, 스펀지로 닦아 주세요.\n③ 깨끗한 물로 충분히 헹구고 뚜껑을 열어 건조 시켜 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}], "sales": {"concept": "버튼 한 번 누르면 정확한 온도 · 정확한 양", "pain": "한밤중에 포트 들어 물 따르고 온도 맞추는 게 너무 번거로워요", "hero": [["자동 출수", "10~300ml 정밀 용량 조절"], ["무드등", "밤중에도 밝게"], ["스마트 분유", "45℃ 영구 보온"], ["위생 출수", "잔류수 없이 새 물만"]], "points": [["버튼 한 번 자동 출수", "무거운 포트 안 들어도 됨"], ["3L 대용량 물통", "하루치 물을 한 번에"], ["잔류수 없는 위생 시스템", "배수통으로 잔수 배출 후 항상 새 물만 출수"]], "persona": [["예비맘", "출산 후 만족도 높은 가전 중 하나예요."], ["유축맘/워킹맘", "복직 후 시간 없을 때 진가가 발휘돼요."], ["신생아 부모", "한밤중에 포트 들 일 없이 버튼 한 번이면 끝."], ["이유식 부모", "이유식 만들 때 정확한 온수 출수에 유용해요."]], "top5": [["출수량 조절되나요?", "10~300ml 범위, 10ml 단위 정밀 조절"], ["물 식는 시간 얼마나?", "사용 환경에 따라 다르지만, 최대 용량(3L) 기준 약 3시간 30분"], ["잔류수가 남지 않나요?", "독자 위생 시스템 → 배수통으로 잔수 배출 후 항상 새 물만 출수"], ["보온은 얼마나 가나요?", "스마트 분유 모드 → 45℃ 영구 보온"], ["물통 용량 충분한가요?", "3L 대용량 물통 → 하루치 한 번에 OK"]]}}, {"id": "easypot", "name": "이지 전기포트 M1", "full": "보아르이지전기포트M1(FV)", "cat": "feed", "catName": "수유·이유식", "tag": "접이식 휴대 포트 · 프리볼트 · 보온 40~90℃ 최대 8시간", "caution": ["유선 전용입니다. 무선 보온은 안 되고, 밀폐형이 아니라 물을 담은 채 들고 다닐 수 없습니다.", "100℃에서 40℃까지 식는 데 약 2시간 26분(600ml 기준)이 걸립니다.", "바닥면·전원부에 물이 닿지 않게 해야 합니다. 물에 담가 씻으면 안 됩니다."], "checks 하여 외부를 닦아 주세요.\n※ 절대 본체 전원부와 아래부분에 물이 들어가거나 닿지 않도록 주의해 주세요.\n\n[제품 내부]\n1. 주전자에 물을 넣고 구연산 1~2스푼을 넣고 물을 끓여 주세요.\n2. 끓인 물을 버린 후, 깨끗한 물을 넣고, 끓이고 버리기를 2~3차례 반복해 주세요.\n3. 필요한 경우 위의 단계를 반복하여 세척해 주세요.\n※ 절대 제품을 물이나 다른 액체에 담그지 마세요.\n※ 제품 외부에 물이 닿거나 전원부에 물이 들어가지 않도록 주의해 주세요.\n※ 포트를 사용하고 나서 바닥에 보이는 부분은 물때가 아닌 수돗물 속의 석회 성분이 뭉쳐서 발생되는 현상으로, 스테인레스 특성 상 발생될 수 있는 부분이며 제품 자체의 결함이 아닙니다.\n※ 제품 세척 시 화학약품이 포함된 물티슈, 알코올, 벤젠 등 화학 용제는 사용하지 마세요."]], "notes": []}], "features": [["프리미엄 SUS 316", "내식성이 더욱 강화된 316 스테인리스로 업그레이드"], ["자동변압 프리볼트", "별도의 설정 없이 현지 전압에 자동 대응"], ["초고속 가열", "약 6분 ~ 8분만에 온도를 끌어올려 균일한 온도 분포를 유지하며 보다 안정적인 100°C 도달을 완성합니다."], ["차별화된 안전 설계", "넓고 안정적인 상부, 안전한 손잡이, 미끄럼 방지 설계"]], "errors": [["고장표시 E1", "온도 센서부분 커넥터 접촉 불량→ 회수하여 처리"]], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "전원 연결 후, 스위치가 작동하지 않음", "a": [["원인", "→ 전원 코드가 제대로 연결되지 않음"], ["확인사항", "→ 전원 코드를 점검하고, 전원 플러그 및 전원 코드가 제대로 꽂혀 있는지 확인해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "대기상태에서 LED가 켜지지만 제품이 작동하지 않음", "a": [["원인", "→ “전원/메뉴” 버튼을 누르지 않음."], ["확인사항", "→ “전원/메뉴” 버튼을 눌러 기능을 선택해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "물이 계속 끓어요", "a": [["원인", "→ “세척” 기능을 선택함. (물이 3분간 끓는 기능)"], ["확인사항", "→“물끓임” 기능을 선택하여 물을 끓여 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "실리콘에서 냄새가 나요.", "a": [["원인", "→ 처음 사용 시 냄새가 날 수 있습니다. 제품의 세척 기능을 사용하여 구연산으로 제품 세척 후 사용해 주시고, 냄새는 여러 차례 사용 시 자연스레 사라집니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "해외에서도 사용할 수 있나요?", "a": [["원인", "→ 본 제품은 프리볼트(100~240V) 지원 제품으로 해외에서도 사용 가능합니다. 다만, 국가별 콘센트 형태에 맞는 변환 플러그는 별도로 준비해 주셔야 하며, 사용 전압 환경에 따라 물이 끓는 속도는 다소 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "스테인레스에 얼룩이 생겨요", "a": [["확인사항", "→ 스테인레스 특성상 물속에 미네랄 성분이 스테인레스 표면에 부착되어 생기는 현상입니다.\n구연산 1~2스푼을 넣고 물을 끓여주신 후 깨끗한 물을 넣고, 끓이기를 2~3차례 반복해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "제품 외부 세척은 어떻게 하나요?", "a": [["확인사항", "→ 제품 외부(바닥면)에 물이 유입될 경우 화재 및 누전의 위험이 있습니다. 외부에 물이 직접 닿지 않도록 주의하여 주시고, 따뜻한 물을 묻힌 부드러운 천을 이용하여 외부를 닦아주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "보온 모드로 설정했는데 온도가 설정값보다 높아지는 것 같아요.", "a": [["확인사항", "→ 보온 모드 작동 시 보온 온도를 유지하기 위해 급속 가열이 되며, 이 과정에서 설정된 온도보다 일시적으로 높게 상승할 수 있습니다. 수유를 목적으로 사용하신다면, 가열 완료 후 약 5~10분 정도 대기한 뒤 사용하시길 권장합니다."]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "연마제 제거 방법 문의시 / 스테인리스 (스테인레스, SUS,스텐 )부분 연마제 제거 방법 문의시", "a": [["대응", "1. 새 제품을 구매한 후 물로 씻지 않은 상태에서 키친타월에 식용유를 묻혀 가열판 및 스테인리스부분을 구석구석을 닦아줍니다. (약 3~4회 반복)\n2. 베이킹소다를 소량 넣고 물을 끓인 뒤, 끓는 상태에서 약 5분 정도 그대로 둡니다.\n3. 물을 버리고 키친타월에 식초를 묻혀 구석구석 닦아내 주세요.\n4. 위 단계를 모두 거친 후 마지막으로 깨끗한 물로 충분히 헹궈 세척해 주세요."]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "가열판 부근 외벽 부분에 검은 얼룩이 확인되며, 스탠 마감이 매끈하지않다는 문의", "a": [["대응", "→ 발열판 생산과정에서 사포로 광을 내는데 저 측면 부분이 짧아 다른 부분처럼 깔끔하지 못하지만, 식용시 인체에 무해합니다."]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "전기포트 가열판에 하얀색/갈색 반점 얼룩이 생겨 문의하는 경우", "a": [["원인", "→ 물에 들어있는 칼슘, 마그네슘 같은 미네랄 성분이 끓고 증발하면서 하얀 반점/얼룩처럼 보입니다.\n→ 미네랄 가루가 쌓이면서 남아 있는 잔열로 인해 갈색으로 변하게 됩니다."], ["대응", "1. 구연산을 소량 넣고 5~10분 정도 끓이고, 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": true}, {"group": "얼룩 · 세척 관련", "q": "스테인레스 가열판 표면의 녹으로 인입되는 경우", "a": [["원인", "→ 물에 포함된 미네랄 성분이 스테인리스 표면에 흡착된 뒤 이 부분이 완전히 제거되지 않아, 제품을 계속 사용하면서 해당 부위가 그을림(갈색)처럼 보이는 흔적이 생길 수 있습니다. 이는 녹이 아니라 미네랄 잔여물로 인한 변색 현상일 가능성이 높습니다."], ["대응", "→ 실제 녹이라면 세척을 해도 제거가 되지 않는 부분이기에 아래 세척 방법을 통해 지워지는지 확인해주시길 바랍니다.\n→ 세척 방법\n① 키친타월에 식초를 충분히 적셔 오염 부위에 5~10분 정도 붙여 방치, 이후 깨끗한 물과 부드러운 스펀지로 닦아 주세요.\n② 만약, 잔여 흔적이 남아 있는 경우, 뜨거운 물 100ml에 구연산 5g을 넣어 끓인 뒤 전원을 끄고 약 1시간 가량 방치한 뒤, 스펀지로 닦아 주세요.\n③ 깨끗한 물로 충분히 헹구고 뚜껑을 열어 건조 시켜 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "실리콘이 몸에 해롭지 않은지 문의시", "a": [["대응", "→ 제품에 사용된 실리콘은 식품용 실리콘이며, 식품안전인증을 받았으므로 안심하고 사용하실 수 있도록 안내"]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "실리콘표면 지우개 같이 때나오는 현상", "a": [["대응", "→ 물 속 미네랄 성분이 실리콘 표면에 부착된 현상, 당사 전제품은 나라에서 식품검역을 받고 수입이 진행되므로 안심하고 세척 후 사용 안내"]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "물을 끓이면 기름때와 같은 부유물이 떠올라 문의하는 경우 / 실리콘 하얀 가루가 묻어나요", "a": [["대응", "→ (상세페이지 하단 Q&A에 고지된 내용인점 참고 바랍니다.) 물 속 미네랄 함량에 따라 부유물이 발생할 수 있습니다. 물을 가열할 경우 미네랄의 주성분인 칼슘이 탄산칼슘으로 변하면서 부유물처럼 발생되나 음용하셔도 무방하니 안심하시고 사용부탁드리며, 이는 불량 사유에 해당되지 않으니 제품 사용에 참고해주시기 바랍니다."]], "notes": [], "media": false}, {"group": "얼룩 · 세척 관련", "q": "뚜껑에 실리콘링 분해세척 가능한가요??", "a": [["대응", "→ 뚜껑 외부는 따뜻한 물을 살짝 묻힌 부드러운 천으로 닦아 관리해 주세요.\n실리콘링 분리 세척을 원하시는 경우, 뚜껑 가운데 있는 나사를 풀어 분리하실 수 있습니다.\n다만, 분리 과정에서 나사에 흠집이 생기면 녹이 발생할 수 있으니 나사가 손상되지 않도록 주의해 주세요."]], "notes": [], "media": false}, {"group": "해외·전압 관련", "q": "해외에서 사용 가능여부 문의시", "a": [["대응", "→ 본 제품은 100V–240V 전압을 지원하는 프리볼트 제품으로, 국가별 콘센트 형태에 맞는 멀티플러그만 사용하시면 변압기 없이 사용하실 수 있습니다.\n→ 전압에 따라 끓는 속도는 상이 할 수 있습니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "물이 없는 경우 자동 전원 차단 여부 / 과열방지 기능 탑재 여부 문의시", "a": [["대응", "→ 제품 내부에 물이 없는 상태에서 작동 시, 일정 온도에 다다르면 온도 제어를 통해 과열방지 기능으로 작동을 멈추고 대기상태로 진입함. (다시 물을 넣거나 온도 하락 시 재작동)"]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "물끓임 온도 설정 가능 여부 문의시", "a": [["대응", "→ 물끓임의 온도는 100℃로 고정되어 있으며, 보온기능의 온도(40~90℃)만 변경 가능."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "분유물로 써도 되나요? 100도 끓고 43도 유지는 몇시간까지 가능한가요 염소제거도 해주나요?", "a": [["대응", "→접이식으로 휴대가 간편해 여행/외출 중 분유물 준비용으로도 사용하실 수 있습니다.\n염소 제거를 원하시는 경우 세척 모드를 사용해 주세요. 물이 100℃까지 끓은 후 3분간 끓임이 유지됩니다.\n가열이 끝나면 보온 모드에서 43℃로 설정해 자연 냉각시킨 후 분유물로 사용하실 수 있으며, 보온 시간은 최대 8시간입니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "아기 분유물 가지고 다닐 휴대용도로 무선으로도 온도 유지되나요?", "a": [["대응", "→ 문의하신 이지전기포트M1 상품은 유선상품으로 무선으로 온도 유지는 어렵습니다. 또한, 밀폐형이 아니기에 물이 담긴 상태로 휴대는 어려운 점 이용에 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "보온 시간을 설정 가능 여부 문의시", "a": [["대응", "→ 보온 최대 작동 시간 8시간으로 8시간 후에는 자동으로 전원이 종료됨. 보온이 끝나면 재설정 안내"]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "가열 후 보온 온도까지 내려가는 시간이 어떻게 되나요?", "a": [["대응", "→ 1. 이지전기포트 M1(FV)은 물을 100℃까지 끓일 수 있습니다.\n2. 보온모드를 사용하여 100℃에서 40℃로 물을 식히는 데는 대략 2시간 26분이 소요됩니다.\n다만, 물이 끓은 후 식는 시간은 여러 가지 요인에 따라 달라질 수 있습니다.\n이러한 요인에는 물의 양, 주변 환경의 온도, 그리고 포트의 열 손실 등이 포함됩니다.\n위 정보는 (환경 온도: 22℃~28℃ / 환경 습도: 35%~45% / 물량: 최대 600ml) 테스트 환경에서 진행되었습니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "42℃로 보온 설정시 42℃로 쭉 나와있던데 원래 이런가요? 그리고 설정온도 도달시 알림음이 없나요?", "a": [["대응", "→ 보온 모드 사용 시에는 설정하신 목표 온도만 표시되며, 해당 온도에 도달하더라도 별도의 알림음은 제공되지 않습니다.\n다만 물을 끓인 후 식히는 과정에서 보온 모드를 설정하신 경우에는 현재 온도가 함께 표시되어, 몇 도까지 내려갔는지 확인 가능한 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "보온이 완료되면 알림음이 뜨나요? / 보온이 완료되면 어떻게 알 수 있나요?", "a": [["대응", "→ 본 제품은 설정한 보온 온도에 도달 시 별도의 알림음은 울리지 않지만, 화면에 표시되는 실시간 온도를 통해 도달 여부를 확인하실 수 있습니다."]], "notes": [], "media": false}, {"group": "사용 · 작동 관련", "q": "220V 차량에서 사용해도 되나요?", "a": [["대응", "→ 최대 소비전력은 1,000W입니다. 차량에 220V 콘센트가 있더라도 차량에서 지원하는 최대 출력 용량에 따라 사용 가능 여부가 달라질 수 있습니다. 사용 전 차량의 220V 출력이 1,000W 이상을 지원하는지 먼저 확인하신 후 이용해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "소재 관련", "q": "열선 종류/형태 문의시", "a": [["대응", "→ 단일 코일로 되어있으며 평판형 입니다."]], "notes": [], "media": false}, {"group": "소재 관련", "q": "안전한 소재 일까요?", "a": [["대응", "→ 식품 접촉용 재질 관련 규정 준수 및 국내 식품 검역 수입 절차를 마친 제품으로 안심하고 사용하실 수 있습니다."]], "notes": [], "media": false}, {"group": "소재 관련", "q": "플라스틱부분( 물 따르는 부분) 미세플라스틱 불검출 검사 결과가 있나요?", "a": [["대응", "→ 문의주신 미세플라스틱 관련 시험 자료는 별도로 보유하고 있지 않습니다.\n다만 본 제품은 수입 시 식품의약품안전처 기준에 따른 정밀검사를 거쳐, 물과 닿는 부품이 식품용 기구 및 용기·포장 기준에 적합 판정을 받았습니다.\n또한 전기·전자제품 유해물질 제한 기준인 RoHS 2.0 규정에도 부합하는 제품입니다."]], "notes": [], "media": false}, {"group": "기타", "q": "물 끓이는 곳에 햇반(즉석밥)이 들어가는지 문의", "a": [["대응", "→ 포트 내부에 들어가지는 않으나, 제품 뚜껑을 연 상태에서 즉석밥 용기의 필름에 작은 구멍을 낸 후 제품 위에 뒤집어 올려놓으면 스팀으로 데울 수 있습니다."]], "notes": [], "media": false}, {"group": "기타", "q": "음식 조리 용도로 사용해도 되는지 문의시", "a": [["대응", "→ 가능하나 라면 등 내부에 음식을 조리하는 경우 이염이나 착색이 생길 수 있  사용 여부", "첫 사용 전 연마제 제거 후 사용 권장"], ["작동 모드", "분유데우기, 모유해동, 이유식중탕,\n 살균, 자동보온모드"], ["보온 작동 시간", "72시간 (분유/모유/이유식모드만 해당)"], ["식기세척기 사용 여부", "바스켓, 투명커버, 집게 가능"], ["작동표시등", "선택한 기능 및 온도표시부 흰색등 표시"], ["내열 온도", "-20~120℃\n (투명커버, 바스켓, 본체, 집게)"], ["가열 온도", "분유데우기: 40℃ (35~50℃ 조절)\n 모유해동: 37℃ (32~42℃ 조절)\n 이유식중탕: 75℃ (60~80℃ 조절)\n 살균: 100℃ (온도조절 불가)"], ["사용 및 보관 온도", "일반 정상적인 실내온도에서 사용"]], "usage": [{"title": "제품 명칭 및 사용 방법", "items": [["", "※ 사용방법\n 1. 본체에 바스켓을 넣어주세요.\n 2. 젖병 또는 용기에 내용물을 채운 다음 바스켓에 넣어주세요.\n 3. 내부 용기에 맞는 양의 물을 넣어주세요. 물은 용기 안에 있는 내용물의 높이가 잠길 만큼 넣어주세요.\n 4. 투명 커버를 덮고 전원을 켜주세요.\n\n ※ 모드 선택하기\n 1. 전원을 켜면 신호음이 한 번 울리고 화면에 ㅡㅡ가 표시되며, 대기 상태로 돌아갑니다.\n 2. 전원 버튼을 눌러 제품을 켜고 끕니다.\n 전원이 켜지면 분유데우기, 모유해동, 이유식중탕, 살균기능 표시등이 모두 켜지고 화면에 00이 점멸됩니다.\n 3. 메뉴 버튼을 눌러 분유데우기, 모유해동, 이유식중탕, 살균의 네 가지 기능을 선택하세요.\n 누를 때마다 하나의 기능만 표시되며, 다른 기능의 표시등은 꺼져 있습니다."], ["분유데우기", "1. 분유를 데울 시           표시등이 켜지고 화면에 기본적으로 40℃가 표시됩니다.\n 2. 해당 표시등에 빠르게 2번 깜빡이고, 신호음이 1번 울려 가열 상태로 들어갑니다.\n 3. \"+\"와 \"-\"를 사용하여 온도는 35~50℃까지 조절할 수 있습니다.\n 4. 가열 과정에서 화면에 현재 온도와 설정 온도가 번갈아 표시됩니다.\n 5. 설정 온도에 도달하면 화면에 설정한 온도값이 유지됩니다."], ["모유해동", "1. 해동시           표시등이 켜지고 화면에 기본적으로 37℃가 표시됩니다.\n 2. 해당 표시등이 빠르게 2번 깜빡이고, 신호음이 1번 울려 가열 상태로 들어갑니다.\n 3. \"+\"와 \"-\"를 사용하여 온도는 32~42℃까지 조절할 수 있습니다.\n 4. 가열 과정에서 화면에 현재 온도와 설정 온도가 번갈아 표시됩니다.\n 5. 설정 온도에 도달하면 화면에 설정한 온도값이 유지됩니다."], ["이유식중탕", "1. 음식을 데울 시           표시등이 켜지고 화면에 기본적으로 75℃가 표시됩니다.\n 2. 해당 표시등이 빠르게 2번 깜빡이고, 신호음이 1번 울려 가열 상태로 들어갑니다.\n 3. \"+\"와 \"-\"를 사용하여 온도는 60~80℃까지 조절할 수 있습니다.\n 4. 가열 과정에서 화면에 현재 온도와 설정 온도가 번갈아 표시됩니다.\n 5. 설정 온도에 도달하면 화면에 설정한 온도값이 유지됩니다."], ["살균", "1. 살균 시 본체 수조에 적당한 물과 젖병 등을 넣고           기능을 선택합니다.\n 2. 해당 표시등이 켜지고 화면에 100℃로 전환되고 수온 상승의 현재 온도가 번갈아 표시됩니다.\n 3. 물이 가열되면 삐- 소리가 나며 10분간 가열하여 살균합니다.\n 4. 멸균 후 대기 상태로 돌아갑니다.\n 5. 살균 기능 사용시에는 투명 커버가 뜨거우니 반드시 주의해서 사용해 주세요."], ["램프", "1. 램프 버튼을 누르면 본체 내부의 조명이 켜지고, 램프 버튼을 한번 더 누르면 조명이 꺼집니다."], ["예약", "[예약 방법]\n 1. 사용하고자 하는 작동 모드를 선택하고 예약 버튼을 누르면 예약버튼이 점멸하며 화면에 예약시간이 표시됩니다.\n 2. 화면에 기본적으로 1시간이 표시됩니다.\n 3. 시간은 \"+\"와 \"-\"로 1~24시간까지 1시간 단위로 조정할 수 있습니다.\n 4. 원하는 시간을 예약하면 해당 표시등이 5번 깜빡 거린 후 예약이 됩니다.\n 5. 예약 카운트다운이 완료되면 \"삐삐\" 소리가 울리며 가열되기 시작합니다.\n 6. 예약시간을 변경 원하시는 경우 예약 버튼을 한 번 누른 후 시간을 조절 할 수 있습니다.\n\n [예약 취소 방법]\n 1. 예약 버튼을 연속으로 2번 누르면 신호음이 1번 울린 후 예약이 취소됩니다."], ["", "※ 작동방법 Tips\n ∙ 온도 설정 시 1℃ 단위로 설정이 가능하며, 길게 눌러 빠르게 설정할 수 있습니다.\n ∙ 가열 중에는 화면에 현재 온도와 설정온도가 번갈아 표시됩니다.\n ∙ 초기에 표시되는 분유데우기, 모유해동, 이유식중탕 모드에서 나타나는 현재 온도는 온도 편차가 발생될 수 있으니 설정 온도에 도달 전까지는 화상에 주의해 주세요.\n* 설정온도에 도달하면 가열판은 작동이 멈추지만, 잔열에 의해 수온이 약 5℃ 이상 상승할 수 있습니다.\n\n ※ 예약기능 Tips\n ∙ 예약 기능은 모드 설정 후 가능합니다.\n ∙ 예약 버튼을 누르고 화면이 깜빡거릴 때 예약 버튼을 또 누르면 취소됩니다."]], "notes": []}, {"title": "주의사항", "items": [["", "1. 아가맘마 보틀워머 사용 시 용기 등의 종류나 크기, 음식물의 온도와 양, 중탕하는 물의 양에 따라 시간 및 온도가 달라질 수 있습니다.\n 2. 아기에게 먹이기 전에 반드시 음식물의 온도를 확인해주세요. 음식물이 충분히 따뜻하지 않으면, 원하는 온도에 도달할 때까지 데워주고 화상에 주의하면서 음식물의 온도를 확인해주세요.\n 3. 화상에 위험이 있으니 음식물을 절대 장시간으로 가열하지 마세요.\n 4. 제품 작동 중 또는 직후에는 투명커버가 매우 뜨거우니 반드시 주의해 주세요."]], "notes": []}], "clean": [{"title": "세척 및 관리 방법", "items": [["", "∙ 물때 및 미네랄 잔여물 제거를 위해 한 달에 한 번씩 식초 또는 구연산을 물과 함께 넣고 10분 이상 담근 후 헹궈주세요.\n ∙ 헹군 후 깨끗한 물로 씻어내고 부드러운 천으로 닦아내 주세요."]], "notes": []}], "features": [["8분 빠른 해동", "단, 8분이면 빠른해동되어 영양소를 그대로 보존 가능"], ["2in1 모유 동시 데우기", "2개의 분유를 동시에 데울 수 있는 충분한 사이즈"], ["자동보온&예약기능", "1시간 단위로 최대 24시간 예약설정 및 기능별 적정 온도 도달 시 자동 보온으로 72시간 까지 보온 가능"], ["젖병 살균 기능", "최대 100℃까지 가열되어 젖병 유해세균 없이 안전하게 소독 후 사용 가능"], ["BPA Free", "BPA 미검출 제품으로 안심하고 사용 가능(본체, 받침대, 뚜껑, 집게 모두 불검출)"]], "errors": [["E0", "E0 와, 100℃, 설정온도가 번갈아가며 표시 (PCBA LED  회로 단선이 주 원인) → 회수하여 처리"], ["E1", "센서 내선 자재불량코드 (온도 감도 작동 이상 발생될 시) →회수하여 처리"], ["E2", "온도 센서의 고장코드 (단락, 커넥터 미결합 주원인) →회수하여 처리"], ["E3", "가열판의 온도가 125℃를 초과했을 때 나타나는 표시창\n E3가 나타나면 전원을 끄고 작동을 멈춘뒤 식히고 사용 필요"]], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "제품이 작동하지 않아요.", "a": [["확인사항", "→ 전원플러그가 꽂혀있는지 확인해 주세요.\n → 코드선이 손상된 경우 고객센터로 문의해 주세요.\n → 전원 연결에 이상이 없는 경우에도 작동이 되지 않는 경우 고객센터로 문의해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "버튼을 눌러도 작동하지 않아요.", "a": [["확인사항", "→ 전원이 켜져있는지 확인해 주세요.\n → 전원이 꺼져있는 경우 전원버튼을 눌러 전원을 켜주세요. 기기가 대기상태로 활성화됩니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "기기 내부에서 냄새가 나요.", "a": [["확인사항", "→ 사용 후에는 제품 보관 및 관리 방법을 참고하여 깨끗한 물로 기기 내부를 청소한 후 보관해주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "\"E1\" 에러코드가 떠요.", "a": [["확인사항", "→ 온도감지 작동에 이상이 발생될 시 발생하는 에러 코드입니다. 고객센터로 문의해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "\"E2\" 에러코드가 떠요.", "a": [["확인사항", "→ 온도센서 인식에 이상이 발생될 시 발생하는 에러 코드입니다. 고객센터로 문의해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "\"E3\" 에러코드가 떠요.", "a": [["확인사항", "→ 제품의 가열판 온도가 125℃를 초과하였을 때 발생하는 에러코드입니다.\n → 내부의 물이 없는 경우 과열 방지를 위해 해당 에러코드가 표시되고 작동을 멈추며, 전원을 끄고 제품을 일정시간 식힌 후에 물을 넣고 다시 켜주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "물 없이도 작동이 되는지 문의", "a": [["대응", "→ 물 없이 전원 작동은 되나, 가열판 온도가 125℃ 도달 시 E3 에러코드 뜨면서 작동 중단되어 실질적인 사용 불가"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "화면에 표시되는 현재온도와 실제 물 온도가 다른 경우", "a": [["대응", "→ 디스플레이의 온도와 물의 온도는 약 2~5℃ 정도의 편차가 발생될 수 있으며, 내용물의 양과 질감에 따라 작동 중 온도 편차가 달라질 수 있음. 최종 가열 후 내용물의 온도와 수온의 온도는 설정온도로 동일해지는 점 참고하여 응대"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "내용물이 빠르게 따뜻해지지 않아요", "a": [["대응", "→ 제품에는 수온을 감지하는 온도 센서가 적용되어 있어, 급격하게 가열되지 않고 내용물의 상태에 맞춰 서서히 온도를 유지하거나 완만하게 데워주도록 설계되어있습니다. 이로 인해 즉각적으로 뜨거워지기보다는 서서히 따뜻해지고 내용물의 온도와 보관 상태에 따라 데우는 시간이 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "<내부 테스트 결과 , 응대 시 참고> 영하 10℃로 냉동된 모유/우유를 모유해동(37℃)’ 모드, 수조 물 1000ml 기준으로 테스트한 결과", "a": [["대응", "→ 용기별 소요 시간 : 모유팩 (180ml): 약 18분, 젖병 (200ml): 약45분\n→ 온도 차이: 젖병 재질(유리, PP, 실리콘 등)이나 보관 상태(냉동/냉장)에 따라 데워지는 시간은 약간씩 차이가 날 수 있습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "모유/ 유축팩 관련 중탕 사용방법 문의시", "a": [["대응", "→ 냉장 보관 및 해동된 모유·분유는 약 37℃ 전후의 체온 정도로 5~10분 정도 천천히 중탕해 주시는 것을 권장 드리고 있어, [분유데우기]모드를 권장 드립니다.\n→ 내용물의 온도 및 보관 상태에 따라 데우는 시간은 달라질 수 있으므로, 모유의 영양소 파괴를 최소화하기 위해 사용 환경에 맞는 모드와 온도를 적절히 조절하여 사용하시길 권장드립니다.\n→ 내열기능이 없는 모유/ 유축팩은 과열될 가능성이 있어 사용 시 조리용 온도계로 온도를 재시면서 사용하시는 것을 권장드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "수유 전에 미리 중탕해두어도 되나요", "a": [["대응", "→ 모유 및 분유는 데운 상태로 장시간 보관할 경우 영양소 손실 및 세균 증식 가능성이 있어 위생상 권장되지 않습니다.\n따라서 수유 직전에 중탕으로 데운 후 바로 수유해 주시는 것이 가장 안전하며, 아기가 먹고 남은 내용물은 재사용하지 않는 것을 권장드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "이유식 중탕은 몇시간 정도 두어야 하나요", "a": [["대응", "→ 이유식 중탕 시간은 용기 재질, 식재료 및 냉장·냉동 여부에 따라 달라질 수 있어, 중간 확인 후 시간 및 온도를 조절하여 사용하시길 권장드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "보온모드의 소비전력 문의시", "a": [["대응", "→보온모드 기본 설정 온도: 40℃\n→온도가 설정된 후 40℃ 온도에 도달하면 대기모드 상태로 전환하며 소비 전력은 0.5W임. 물의 온도가 떨어져 재가열을 할 경우 소비전력이 올라갈 수 있는 점 참고하여 응대"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "모드별 소비전력 문의시", "a": [["대응", "→ 450W~460W로 모드별 큰 차이는 없음"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "대기모드가 있나요 문의시", "a": [["대응", "→ 보온 시작 후 72시간이 경과하면 자동으로 대기 모드로 전환 되며, 전원은 꺼지지 않습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "설정 온도 보다 수온이 더 높게 올라가는 경우", "a": [["대응", "→ 실제 제품에서 가열은 멈추었으나 가열판의 잔열로 인해 약 5℃ 이상 수온이 상승할 수 있음. 이는 제품의 불량은 아님"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "뜨거운물을 넣고 시작하나요 / 찬물을 넣고 시작하나요 문의시", "a": [["대응", "→ 중탕기는 찬물(또는 미지근한 물) 상태에서 분유, 모유, 이유식을 함께 넣고 서서히 가열하는 방식으로 사용을 권장드립니다.\n모유는 사람 체온 정도로 데워 사용해 주시고, 이유식은 골고루 데워진 후 중간중간 온도를 확인해 주시기 바랍니다. 분유는 수유 직전에 타서 바로 먹이는 것을 권장드리며, 가능하면 재가열은 피해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "분유데우기 모드와 모유 해동 어떤 것을 사용해야 하나요", "a": [["대응", "→ 두 기능은 작동 방식은 동일하나 설정 가능한 온도 범위에 차이가 있습니다. 35~42℃사이로 설정하는 경우라면 어떤 모드를 사용해도 관계 없습니다.\n→ [분유데우기] 온도설정 범위 : 35~50℃ / [모유해동] 온도설정 범위 : 32~42℃"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "타이머 기능은 켜지는 타이머인가요 꺼지는 타이머인가요", "a": [["대응", "→ 해당 기능은 아기 수유 시간에 맞춰 미리 데워질 수 있도록 설정하는 켜짐 예약 기능입니다. 예를 들어 아기에게 1시간 뒤 수유 예정이라면 1시간 뒤로 타이머를 설정해 두시면, 아기가 모유나 이유식을 먹는 시간에 맞춰 미리 데워지도록 작동합니다."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "중탕기 물은 얼마나 한번씩 갈아줘야하고, 세척은 얼마나한번씩 해야하나요?", "a": [["대응", "→ 중탕기 물 교체 횟수는 정해져 있지 않으며, 물이 오염되었거나 장시간 사용한 경우 새 물로 교체해 주시는 것을 권장드립니다.\n세척은 물때 및 미네랄 잔여물 제거를 위해 내부를 한 달에 한 번씩 식초 또는 구연산을 물과 함께 넣고 10분 이상 담근 후 헹궈주시길 바랍니다. 헹군 후 깨끗한 물로 씻어내고 부드러운 천으로 닦아내 주세요."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "열판에 하얀 반점 또는 무지개 빛 얼룩이 생겨 문의하는 경우", "a": [["대응", "→ 스테인리스 특성상 물 속에 미네랄 성분이 표면에 부착되어 생기는 현상으로 구연산과 베이킹 소다 또는 식초를 넣고 끓이면 오염 및 얼룩이 사라짐."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "구성품 UV 소독기 사용 가능 여부", "a": [["대응", "→ 바스켓, 집게, 투명커버 UV 소독기 사용 가능"]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "살균모드 사용시 바스켓 빼고 사용하는지 문의시", "a": [["대응", "→ 살균 모드에서는 내부 온도가 100℃ 이상으로 올라가므로, 넣은 제품이 가열판에 직접 닿지 않도록 바스켓을 함께 사용해 주셔야 제품 및 용품의 변형을 방지할 수 있습니다."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "소독시에는 끓은 후에 젖병 넣어 열탕소독 하면 되나요? 아니면 처음부터 넣고 소독 기능 누르면 되나요?", "a": [["대응", "→ 일반적으로 젖병은 세척 후 끓는 물에서 열탕소독하며, 젖병 본체는 약 3~5분, 젖꼭지와 부속품은 약 30초~1분 정도 소독하여 사용합니다.\n젖병의 재질과 제조사 권장 사용 방법에 따라 열탕소독 가능 여부 및 권장 시간이 다를 수 있으므로, 젖병 구매처로 확인해 주시길 권장드립니다."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "연마제 제거 방법 문의시", "a": [["대응", "1. 새 제품을 구매한 후 물로 씻지 않은 상태에서 키친타월에 식용유를 묻혀 가열판 및 스테인리스부분을 구석구석을 닦아줍니다. (약 3~4회 반복)\n2. 헝겊에 물을 적셔 이물질이 나오지 않을 때 까지 닦아냅니다."]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "가열판에 하얀/갈색 반점 또는 무지개 빛 얼룩 문의시", "a": [["원인", "→ 가열판 내부의 무지개빛 얼룩은 물 속의 철·구리 등 미량 금속 성분이나 가열 시 스테인리스 표면의 산화 반응으로 나타나는 자연스러운 현상입니다.\n→ 물에 들어있는 칼슘 , 마그네슘 같은 미네랄 성분이 끓고 증발하면서 하얀 얼룩처럼 보입니다.\n→ 미네랄가루/침전물이 쌓이면서 남아 있는 잔열로 인해 갈색으로 변하게 됩니다."], ["대응", "1. 구연산을 소량 넣고 5~10분 정도 살균모드를 사용 하여 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 외부로 물이 유입되지 않도록 주의하여 깨끗한 물로 헹구고 뚜껑을 열어 건조 시켜 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}, {"group": "세척 · 보관", "q": "스테인레스 가열판 표면의 녹으로 인입되는 경우", "a": [["원인", "→ 물에 포함된 미네랄 성분이 스테인리스 표면에 흡착된 뒤 이 부분이 완전히 제거되지 않아, 제품을 계속 사용하면서 해당 부위가 그을림(갈색)처럼 보이는 흔적이 생길 수 있습니다. 이는 녹이 아니라 미네랄 잔여물로 인한 변색 현상일 가능성이 높습니다."], ["대응", "→ 실제 녹이라면 세척을 해도 제거가 되지 않는 부분이기에 아래 세척 방법을 통해 지워지는지 확인해주시길 바랍니다.\n→ 세척 방법\n① 키친타월에 식초를 충분히 적셔 오염 부위에 5~10분 정도 붙여 방치, 이후 깨끗한 물과 부드러운 스펀지로 닦아 주세요.\n② 만약, 잔여 흔적이 남아 있는 경우, 뜨거운 물 100ml에 구연산 5g을 넣어 살균모드를 작동 후 전원을 끄고 약 1시간 가량 방치한 뒤, 스펀지로 닦아 주세요.\n③ 외부로 물이 유입되지 않도록 주의하여 깨끗한 물로 헹구고 뚜껑을 열어 건조 시켜 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}, {"group": "기타", "q": "BPA Free 관련 시험성적서 문의", "a": [["대응", "→ 구성품 (본체, 받침대, 뚜껑, 집게)에 대한 시험시 모두 \"불검출\"된 시험성적서 보유하고 있음\n → 시험성적서 서류 요청 시 소속 팀장 측으로 확인 요청"]], "notes": [], "media": false}, {"group": "기타", "q": "이유식 중탕 할 때 뚜껑을 닫고 하나요?", "a": [["대응", "→ 밀폐용기의 뚜껑을 완전히 닫은 상태로 중탕할 경우 내부 압력이 상승할 수 있으므로, 안전한 사용을 위해 뚜껑을 분리하거나 밀폐용기 제조사에서 안내하는 방법에 따라 사용해 주시기 바랍니다. 또한, 사용하시는 용기가 중탕 가능한 내열 소재인지 확인 후 이용해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "기타", "q": "유리젖병 사용 가능한지 문의시", "a": [["대응", "→ 중탕기 사용 시 젖병의 소재·내열 온도 기준은 제조사마다 다를 수 있어, 사용 가능 여부는 젖병 제조사 고객센터로 문의해 주시는 것이 가장 정확합니다. 내열기능이 없는 젖병은 과열될 가능성이 있어 사용 시 조리용 온도계로 온도를 재시면서 사용하시는 것을 권장드립니다."]], "notes": [], "media": false}, {"group": "기타", "q": "젖병 젖꼭지나 쪽쪽이 살균도 가능한가요?", "a": [["대응", "→ 본 제품은 살균 모드를 선택하여 약 10분간 가열 살균이 가능하여 젖꼭지나, 쪽쪽이 등을 넣어 살균 할 수 있습니다. 다만, 젖꼭지나 쪽쪽이의 경우 제품별 소재 및 내열 온도가 상이할 수 있으므로, 사용 전 해당 제품 제조사를 통해 가열 살균이 가능한 소재인지 확인해 주시기 바랍니다. 또한, 가열 살균이 가능한 제품이더라도 제조사에서 안내하는 권장 살균 온도 및 시간을 확인하시어 해당 기준을 초과하지 않는 범위 내에서 사용하시는 것을 권장드립니다."]], "notes": [], "media": false}], "sales": {"concept": "분유 · 모유 · 살균 · 이유식 한 대로 끝낸다", "pain": "새벽 수유의 번거로움 + 모유 영양소 손실 걱정", "hero": [["분유 보온", "적정 온도 자동 유지"], ["모유 해동", "저온 중탕 영양 보존"], ["젖병 살균", "고온 가열 살균"], ["이유식 보온", "중탕 · 보온 가능"]], "points": [["2in1 듀얼 구조", "젖병 2개 동시 가능 (쌍둥이 OK)"], ["4-in-1 멀티 기능", "별도 가전 살 필요 없음"], ["72시간 보온 + 24시간 예약", "새벽 수유 시간 단축"]], "persona": [["예비맘", "신생아부터 이유식까지 한 대로 다 됩니다."], ["유축맘/워킹맘", "저온 중탕으로 모유 영양소 보존됩니다."], ["신생아 부모", "오늘 밤부터 30분 더 주무실 수 있어요."], ["이유식 부모", "이유식 시기까지 쓰면서 살균까지 돼요."]], "plus": "엄마들이 직접 뽑은 1등 워머. 압도적인 판매량과 '베이비뉴스' 선호도 조사 3년 병을 사용해 주십시오."], ["", "2. 분유 섞기 기능\n· [시작] : 전원 버튼을 길게 누르면 기기가 작동하며, 분유 병이 정/역방향으로 회전합니다.\n· [타이머] : 타이머 버튼을 누를 때마다 30초씩 증가합니다. (60초~900초).\n· [속도 조절] : 속도 버튼을 눌러 1단계(최저)에서 4단계(최고)까지 조절할 수 있습니다.\n  분유를 섞는 과정에서 거품이 발생할 경우, 속도 단계를 낮춰서 사용하시기 바랍니다.\n· [회전 시간 조절] : 특정 분유에 따라 회전 시간을 더 늘려야 할 수 있습니다. 필요 시 추가로 더 작동해 주십시오.\n· [사용 순서] : 젖병에 40도 이상의 물을 먼저 넣고, 분유를 추가한 후 작동해 주십시오.\n· [종료] : 전원 버튼을 짧게 눌러 기능을 종료합니다."], ["", "3. 보온 기능\n· 보온 기능은 유선으로만 사용 가능하며, 충전 단자에 전원이 연결된 상태에서 작동합니다.\n· 어댑터 정격 : DC 5V, 2A.\n· 내부 가열판이 천천히 가열하여 분유의 온도를 오랫동안 유지합니다.\n· 120~300mL 분유 : 보온 버튼을 짧게 눌러 사용. 설정 완료 시 보온 램프가 점등됩니다.\n· 40~120mL 분유 : 보온 버튼을 길게 눌러 사용. 설정 완료 시 보온 램프가 점멸하며 보온 모드로 전환됩니다.\n· 종료 :  보온 작동 시 짧게 눌러 보온 기능을 종료합니다.\n※ 보온 기능이 작동 중일 때 충전 단자에서 전원을 제거하면 보온 기능이 취소됩니다. 다시 연결하면 자동으로 활성화됩니다.\n※ 보온 기능을 사용하지 않을 경우, 유선이나 무선 모두 보온 기능을 반드시 취소해 주십시오.\n※ 보온 기능이 작동 중일 경우 충전이 이루어지지 않습니다."], ["", "4. 동시 사용 가능\n·  분유 섞기 기능과 보온 기능을 동시에 사용할 수 있습니다."]], "notes": []}], "clean": [{"title": "세척 방법", "items": [["", "·  충전 단자를 분리한 후, 평평한 곳에 놓습니다.\n·  부드러운 천을 이용하여 본품 표면의 먼지와 오염물을 부드럽게 닦아냅니다.\n·  마른 천으로 본품 표면을 다시 한 번 부드럽게 닦아냅니다.\n·  세척 후에는 충분히 건조시킨 후 사용/보관해 주십시오.\n ※ 화학 약품, 물티슈 등으로 본품을 세척하지 마십시오.\n ※ 본품 내부에 물이 들어가지 않도록 주의하십시오."]], "notes": []}], "features": [["거품 ZERO", "360도 양방향 회전으로 거품 제로. 강력하고 부드러운 양방향 회전으로 분유를 혼합하여 거품 없이 부드럽게 만들어줍니다."], ["30초 단위 시간 설정", "60~900초까지 30초 단위를 자유롭게 설정해보세요. (잔여 시간 실시간 확인 가능)"], ["다양한 젖병 사이즈 호환", "분유병이 들어가지 않는다면 내부 고정틀을 분리해서 병을 직접 고정해주세요."], ["바닥 흡착판", "3개의 흡착 발판으로 미끄럼 없이 안전한 사용이 가능합니다."]], "errors": [], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "제품이 동작하지 않습니다.", "a": [["확인사항", "→ 제품을 충분히 충전 후 사용해 주십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "충전 후 작동 시간이 짧습니다.", "a": [["확인사항", "→ 2시간 이상 충전해 주십시오.\n→ 고객센터로 문의해주십시오."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "분유 병이 제대로 회전하지 않습니다.", "a": [["확인사항", "1. 기기를 평평하고 안정된 표면에 놓았는지 확인해 주십시오.\n 2. 병이 기기에 제대로 고정되었는지 확인해 주십시오.\n 3. 분유 병의 크기가 너무 커서 내부 고정틀에 들어가지 않을 경우, 내부 고정틀을 분리하여 병을 직접 고정해 주십시오."]], " 되면 상태 표시창이 약 5회 점멸 후 작동을 시작합니다."], ["", "3. 모드 상세 설명\n\n[ 자동모드 ]\n·  설명 : 25분, 35분, 45분 중 선택하여 소독 및 건조를 자동으로 수행합니다.\n·  25분 : 20분 열풍 건조 + 소독(모든 UV 작동) → 5분 자연풍(모든 UV 작동)\n·  35분 : 30분 열풍 건조 + 소독(모든 UV 작동) → 5분 자연풍(모든 UV 작동)\n·  45분 : 40분 열풍 건조 + 소독(모든 UV 작동) → 5분 자연풍(모든 UV 작동)\n·  열풍 건조 온도 : 65℃\n\n [ UV 살균모드 ]\n·  설명 : 10분, 15분, 20분 중 선택하여 UV 조명을 통해 살균 및 자연풍으로 건조합니다.\n\n[ 건조모드 ]\n·  설명 : 15분, 25분, 35분 중 선택하여 젖병을 열풍 건조합니다.\n·  설정 온도 : 내부 온도를 65℃로 유지합니다.\n\n[ 보관모드 ]\n·  설명 : 매 시간마다 5분 동안 자연풍(모든 UV 작동)을 통해 살균 작동하며, 총 72시간 동안 작동 후 자동으로 종료됩니다.\n·  작동 표시 : 작동 중에는 상태 표시창 화면에 “00”이 표시됩니다.\n·  남은 시간이 9시간 이하일 경우, 상태 표시창에 ”남은 시간 + H” 로 표시됩니다. (예 : 9H, 8H, 7H 등).\n·  남은 시간이 1시간 미만일 경우, 남은 시간을 분 단위로 표시합니다.\n\n[ 저온건조모드 ]\n·  모드 설명 : 45분, 50분, 60분 중 선택하여 저온에서 건조합니다.\n·  설정 온도 : 내부 온도를 40℃로 유지합니다."], ["", "4. 사용 후 관리\n·  사용 후 내부를 부드러운 천을 이용하여 깨끗이 닦아줍니다.\n·  후면의 필터 커버를 분리한 후 먼지를 제거해 주십시오."]], "notes": []}], "clean": [{"title": "세척 방법", "items": [["", "[ 외부 세척 방법 ]\n · 전원 코드를 분리한 후, 제품을 평평한 곳에 놓아 주십시오.\n · 부드러운 천을 이용하여 본체 표면의 먼지와 오염물을 부드럽게 닦아주십시오.\n · 마른 천으로 본품 표면을 다시 한 번 부드럽게 닦아 주십시오.\n · 세척 후에는 충분히 건조시킨 후 사용 또는 보관해 주십시오.\n\n[ 내부 세척 방법 ]\n · 제품을 처음 사용하기 전에 식용유를 키친타월에 묻혀 스테인리스 부분을 닦아 주십시오.\n · 깨끗한 물을 부드러운 천에 묻혀 내부를 충분히 닦아 주십시오.\n · 세척 후에는 충분히 건조시킨 후 사용하거나 보관해 주십시오.\n\n[ 필터 청소 방법 ]\n · 후면의 필터 커버를 분리해 주십시오.\n · 필터 내부의 먼지를 부드러운 청소솔이나 청소기를 이용해 제거해 주십시오"]], "notes": []}], "features": [["UV-C LED 램프", "상단 6개, 전면 4개, 후면 2개, 좌측면 4개, 우측면 4개, 램프하단 6개로 총 26개. 사각지대 없이 완벽하게 살균 \"젖병을 뒤집어도 세워도 문제 없어요\""], ["대용량", "젖병만 수납 시 32개까지 가능한 넉넉한 수납. 필수품부터 부속품들까지 넉넉하게."], ["최고급 8K 스테인레스", "입체적인 다이아몬드 패턴으로 완벽하게 살균."], ["듀얼팬, 듀얼공기배출구", "빠르게 깨끗한 공기로 순환, 아가 퓨어만의 독보적인 듀얼 공기 순환"], ["내부 조명등", "야간 수유에도 문을 열면 내부 조명이 자동으로 켜져 쉽게 찾을 수 있습니다."]], "errors": [], "staffSpec": [], "qa": [{"group": "제품 ·사용 관련", "q": "트레이를 넣을 때 뻑뻑해요 / 긁혀요 / 갈려요", "a": [["확인사항", "→ 스테인리스 소재 특성상 사용 환경 및 온도 변화에 따라 약간의 수축과 팽창이 발생할 수 있습니다. 사선으로 넣어 한쪽을 먼저 맞춘 뒤, 아래로 눌러 끼우는 방식으로 사용하면 가능합니다.\n→\n→"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련" "", "·  제품 뒷면에 정격 (12V, 3A 이상)에 맞는 어댑터와 동봉된 케이블을 충전 단자에 연결해 충전해 주세요.\n·  충전이 완료되면 충전 케이블을 분리해 주세요.\n·  충전시간 : 약 1시간 30분 / 사용시간 : 20분 - 약 2회 / 40분 - 약 1회\n\n※ 사용하는 어댑터 정격에 따라 충전 표시등이 다르게 나타납니다.\n※ 충전 시간은 실제 충전 시간은 연결 기기의 소비 전력, 케이블, 사용 환경, 배터리 수명에 따라 달라질 수 있습니다.\n※ 충전 속도가 저하될 경우, 고속 어댑터를 사용하시면 충전 시간을 단축하실 수 있습니다.\n※ 충전 중에 사용하지 마세요.\n\n충전 냉각 프로그램\n·  충전 중에 기계가 배터리 온도를 자동으로 감지하여, 배터리 온도가 과도할 경우 자동으로 작동시켜 냉각하고, 상태표시창에 돌아가는 상태가 표시됩니다."]], "notes": []}], "clean": [{"title": "세척 방법", "items": [["본품", "·  충전 케이블 분리 후, 전원이 꺼진 상태로 평평한 곳에 놓아 주세요.\n·  부드러운 천을 이용하여 본품 표면의 먼지와 오염물을 부드럽게 닦아 주세요.\n·  마른 천으로 본품 표면을 다시 한 번 부드럽게 닦아 주세요.\n·  세척 후에는 충분히 건조시킨 후 사용/보관해 주세요."], ["상/하단 선반", "·  상/하단 선반을 흐르는 물에 깨끗이 헹궈 주세요.\n·  세척한 상/하단 선반은 통풍이 잘되는 그늘에서 완전히 말려 주세요.\n·  건조가 끝난 상/하단 선반을 다시 조립하여 사용해 주세요."], ["필터 청소 방법", "·  하단의 필터 커버를 분리해 주세요.\n·  필터를 흐르는 물에 깨끗이 헹궈 주세요.\n·  세척한 필터는 통풍이 잘되는 그늘에서 완전히 말려 주세요.\n·  건조가 끝난 필터를 다시 조립하여 사용해 주세요."], ["세척 주의사항", "※ 제품 세척 시 화학약품이 포함된 물티슈, 알코올, 벤젠 등 화학 용제는 사용하지 마세요.\n※ 제품 세척 시 기기의 전원을 꺼주세요.\n※ 세척 시 충전 단자 마개를 닫고, 충전 단자 및 버튼 주변에 물이 들어가지 않도록 주의해 주세요.\n※ 본체를 물이나 액체에 절대 담그지 마세요. 합선 또는 기기 손상의 원인이 됩니다."]], "notes": []}], "features": [["강력한 살균력", "유해균 5종(대장균, 녹농균, 황색포도상구균, 폐렴균, 살모넬라균)을 99.9% 살균합니다."], ["살균+열풍 건조", "60℃ 열풍으로 공기를 순환시켜 젖병과 작은 부품에 남은 물기까지 빠르고 꼼꼼하게 말려줍니다."], ["터치 한번으로 간편하게", "소독하고 꺼내서 다시 말릴 필요 없이 버튼 한번으로 진짜 안심 케어 완성"], ["잠금버튼", "슬라이딩 방식의 잠금 버튼으로 오작동 방지"]], "errors": [], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "전원이 켜지지 않아요.", "a": [["확인사항", "→ 제품 정격(12V, 3A)에 맞는 어댑터를 사용하여 충전되었는지 확인해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "충전 후 작동 시간이 짧아요.", "a": [["확인사항", "→ 약 1시간 30분 이상 충전해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "상태표시창에 E1, E2 오류 메시지가 표시됩니다.", "a": [["확인사항", "→ 온도 센서에 문제가 발생했습니다. 고객센터로 문의해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "상태표시창에 E4 오류 메시지가 표시됩니다.", "a": [["확인사항", "→ 출풍구에 이물질이나 내용물로 막혀 있지 않은지 확인해 주세요.\n→ 하단 필터 부분을 청소해 주세요.\n→ 문제가 해결되지 않을 시 고객센터로 문의해 주세요."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "충전 불빛이 달라요", "a": [["확인사항", "→ 사용하는 어댑터 정격에 따라 충전 표시등이 다르게 나타나며, 저속 어댑터를 이용하여 충전 시 배터리표시등 흰색 LED 순차 점멸(깜빡), 고속어댑터 충전 시 파란색 LED 순차 점멸(깜빡)으로 보여집니다. (완충시 점등)"]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "빨간 불빛(배터리부족) 상태에서 시간설정이 되지 않아요", "a": [["확인사항", "→ 배터리가 없을 때 전원은 켜지나, 시간 작동이 되지 않습니다. 배터리를 충분히 충전 시켜주세요."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "본체 안쪽에 있는 은색 구슬은 뭔가요? / 바닥에 있는 구슬은 무엇인가요?", "a": [["확인사항", "→ 온도 감지 센서 입니다."]], "notes": [], "media": true}, {"group": "응대 가이드", "q": "작동중 문을 열고 다시 닫으면 작동시간이 리셋되나요?", "a": [["확인사항", "→120초 이내에 뚜껑을 닫으면 남았던 시간만큼 작동이 이어서 진행되고, 120초 초과 시 대기모드로 완전 전환 됩니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "작동 중 모드 변경하면 시간이 다시 리셋되나요?", "a": [["확인사항", "→ 모드 변경시 시간이 리셋되며, 처음부터 다시 작동됩니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "특정 브랜드 젖병 사이즈 호환 가능여부 / 특정 브랜드 젖병 들어가는지 문의시", "a": [["확인사항", "→ 본 상품의 내부 사이즈는 가로155, 세로 71, 높이 55mm 입니다. 젖병의 경우 제품별 크기와 형태가 상이하여 특정 젖병의 투입 가능 여부를 정확하게 안내드리기 어려운 점 양해 부탁드립니다. 사용하시는 젖병의 사이즈를 측정하신 후 제품의 내부 사이즈와 비교하여 구매에 참고해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "젖병은 몇 ml까지 들어갈 수 있나요?", "a": [["확인사항", "→ 본 상품의 내부 사이즈는 가로 155 × 세로 71 × 높이 55mm입니다. 젖병은 용량(mL)이 작더라도 제품별 외관 크기나 형태, 두께 등이 상이하여 내부에 들어가지 않을 수 있기 때문에 용량만으로는 투입 가능 여부를 정확하게 안내드리기 어렵습니다. 따라서 사용하시는 젖병의 전체 외관 사이즈를 측정하신 후, 위 안내드린 제품 내부 사이즈와 비교하여 구매에 참고해 주시는 것을 권장드립니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "유리젖병 사용 가능한가요?", "a": [["확인사항", "→ 본 제품의 UV 램프 종류는 UV-C LED이며, 열풍 온도는 약 60~65℃입니다. 유리 젖병의 경우 제품별 소재 및 내열 온도가 상이할 수 있어, 젖병 제조사를 통해 UV 사용 가능 여부 및 60~65℃의 열풍 온도에서 사용 가능한 제품인지 확인하신 후 사용을 권장드립니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "작동 중 뚜껑을 열면 작동을 멈추나요?", "a": [["확인사항", "→ 작동 중 뚜껑을 열면 UV 램프가 중지되고, 알림음이 울리며 대기모드로 전환 됩니다.\n120초 이내에 뚜껑을 다시 닫으면 작동이 이어서 진행되고, 120초 초과 시 대기모드로 완전 전환 됩니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "뚜껑을 열고 닫을 때 틱틱 소리가 나는데 불량인가요?", "a": [["확인사항", "→ 전원 작동을 위한 탭스위치 소리입니다. 예를 들어 뚜껑을 열 때 틱 소리가나면서 작동이 중지됩니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "20분 모드는 바로 작동 소리가 나는데, 40분 모드는 작동소리가 안나요 / 40분 모드 설정했는데 UV만 작동되고 있어요", "a": [["확인사항", "→ 40분 모드는 초반 5분 동안 열풍이 작동하지 않습니다. 5분이 경과하고 이후 남은시간 35분 동안 열풍이 작동합니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "UV가 정상 작동하는지 확인하려고 작동 중간에 뚜껑을 살짝 열어보면 UV램프가 꺼져있어요", "a": [["확인사항", "→ 20분/40분 모드 작동 시, 시작 후 약 15분 동안 UV 기능이 작동하며 이후 남은 시간에는 열풍 기능만 작동합니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "20분모드 / 40분모드 차이점이 뭔가요?", "a": [["확인사항", "→ 20분 모드는 처음 15분 동안 살균과 건조가 함께 진행되며, 마지막 5분은 건조로 마무리됩니다. 40분 모드는 처음 5분은 살균, 이후 10분은 살균+건조, 마지막 25분은 건조로 진행됩니다.\n빠르게 살균이 필요한 경우에는 20분 모드, 충분한 건조 시간을 확보하고 싶은 경우에는 40분 모드 사용을 권장드립니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "물티슈/소독용티슈로 닦아도 되나요?", "a": [["대응", "→ (첫 사용 시) 가재손수건 등에 물을 적셔 제품을 가볍게 닦아주시는 것을 권장드립니다.\n물티슈 사용을 원하실 경우, 특수목적용(어린이용품 전용)이 표시된 제품인지 확인 후 사용해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "응대 가이드", "q": "USB-C타입으로 충전해도 되나요?", "a": [["대응", "→ USB타입으로 충전도 가능하나, 저속으로 충전됩니다. 빠르고 안정적인 충전을 위해 12V·3A 출력을 지원하는 36W 이상의 PD 충전기와 C to C 케이블 사용을 권장드립니다. 권장 규격보다 낮은 출력의 충전기를 사용할 경우 충전 속도가 느려질 수 있습니다."]], "notes": [], "media": false}], "sales": {"concept": "젖병까지 넣을 수 있는 휴대용 UV 소독기", "pain": "외출 · 여행 시 젖병 소독할 방법이 마땅치 않아요", "hero": [["UV-C 살균", "99.9% 살균력"], ["젖병도 가능", "쪽쪽이보다 큰 용량으로 젖병까지"], ["휴대 케이스", "여행 · 외출 필수품"], ["젖꼭지 · 컵도 OK", "다양한 육아용품 소독"]], "points": [["젖병까지 소독 가능한 사이즈", "쪽쪽이 살균기보다 넓은 용량"], ["여행 · 외출용 휴대성", "가방에 넣어 이동 가능"], ["다용도 살균", "젖병 · 젖꼭지 · 컵 · 소품까지"]], "persona": [["예비맘", "출산 후 첫 조리원 · 친정 이동 시 필수예요."], ["유축맘/워킹맘", "출장 · 여행 시 유축 부품 소독에 유용."], ["신생아 부모", "외출 시 젖병 위생을 챙기실 수 있어요."], ["이유식 부모", "이유식 컵 · 수저 소독까지 활용 가능."]], "top5": [["쪽쪽이 살균기랑 뭐가 달라요?", "더 큰 사이즈 → 사이즈만 맞다면 작은 젖병도 가능"], ["어떤 젖병까지 들어가요?", "가로 155 × 세로 71 × 높이 55mm 이내 젖병이라면 가능"], ["여행 갈 때 챙길 만해요?", "휴대용 파우치 포함 → 여행 가방에 OK"], ["쪽쪽이 살균기 있으면 필요 없나요?", "쪽쪽이 살균기는 소품용, 아가미니는 젖병 · 숟가락 · 컵 · 쪽쪽이  누를 시 : 무드등 ON/OFF 설정이 가능합니다.\n·  무드등은 전구색 2단계 / 주광색 2단계로 설정할 수 있으며, 단독 사용도 가능합니다.\n·  길게(3초 이상) 누를 시: 잠금(Child Lock) ON/OFF 설정이 가능합니다.\n·  잠금 설정 시 현재 상태는 유지되고 버튼이 잠기며, 상태표시등이 3회 점멸한 후 흰색 LED가 켜집니다."], ["타이머 버튼", "·  버튼을 짧게 눌러 1~7시간 후 자동으로 꺼지도록 예약할 수 있습니다.\n·  시간은 켜진 LED(1시간, 2시간, 4시간)의 숫자를 모두 더한 값으로 설정됩니다.\n   ※ 예시 : 1시간과 4시간 LED가 함께 켜져 있으면 5시간으로 설정된 것입니다."], ["세척 버튼", "·  대기 상태에서 세척 버튼을 누르면 세척이 시작되며, 세척 표시등만 켜집니다.\n·  물이 완전히 끓으면 자동으로 작동을 멈추고 대기 상태로 돌아갑니다.\n·  작동 20시간 경과 후 세척 표시등이 켜졌을 때, 세척 버튼을 길게 누르면 표시등이 꺼지고 타이머가 재설정됩니다.\n   ※ 제품이 이미 작동 중일 때는 버튼을 눌러도 반응하지 않습니다. 반드시 대기 상태에서 작동해 주세요."]], "notes": []}], "clean": [{"title": "세척 및 관리방법", "items": [["", "※ 제품 세척 시 화학약품이 포함된 물티슈, 알코올, 벤젠 등 화학 용제는 사용하지 마세요.\n※ 수조의 물을 오래 방치할 경우 세균 번식으로 인하여, 불쾌한 냄새가 나거나 건강에 안 좋은 영향을 줄 수 있습니다. 가습에 사용하는 물은 반드시 매일 깨끗한 물로 교체하여 주시고, 2~3일에 한 번 수조부를 세척해 주세요. 제품의 올바른 사용을 위하여 꾸준히 세척하여 위생적으로 관리해 주시기 바랍니다."], ["본품 청소 방법", "·  본품 외부 및 내부가 오염, 이염 되었을 경우 부드러운 천에 소량의 물을 적셔 가볍게 닦아낸 후 마른 헝겊, 천 등을 사용해 물기를 제거해 주십시오.\n※ 내부 청소 시 수조부 고정틀을 분리하면 더욱 편하게 청소가 가능합니다."], ["수조부 세척 방법", "※ 안전을 위해 열이 완전히 식은 후 세척 및 물기를 닦아 주세요.\n·  청소 전 반드시 전원코드를 분리해 주세요.\n·  본체와 수조부를 분리해 주세요.\n·  수조부 뚜껑을 분리한 후 수조부에 남아있는 물을 모두 비워 주세요.\n·  수조부에 물 1L 기준 구연산 50g 비율로 녹인 물을 넣어 주세요.\n·  30분 정도 경과 후 깨끗한 물로 헹구어 닦아 주세요.\n·  세척 후에는 충분히 건조하여 사용/보관해 주세요.\n※ 본체와 수조부 연결 부위의 전원 단자에 물이 닿지 않도록 주의해 주세요."], ["뚜껑 청소 방법", "·  청소 전 반드시 전원코드를 분리해 주세요.\n·  뚜껑의 PUSH 버튼을 눌러 분리해 주세요.\n·  가습구를 분리해 주세요. (뚜껑 안쪽에서 바깥으로 밀어 분리가 가능합니다.)\n·  뚜껑 하단 부분을 분리해 주세요.\n·  실리콘 링을 분리해 주세요."], ["", "·  뚜껑은 오염, 이염이 되었을 경우 부드러운 천에 소량의 물을 적셔, 가볍게 닦아낸 후 마른 헝겊, 천 등을 사용해 물기를 제거해 주세요.\n·  가습구, 뚜껑 하단 부분, 실리콘 링은 중성세제를 사용하여 물로 가볍게 세척해 주세요.\n·  물기를 털고, 통풍이 잘 되는 곳에서 건조시켜 주세요.\n·  건조 완료 후 분해한 역순으로 재조립하여 사용해 주세요.\n※ 뚜껑 전체를 물에 담그면 내부로 물이 유입될 수 있으니 주의해 주세요."]], "notes": []}], "features": [["100℃가열 수증기", "100℃로 끓여 세균과 이물질은 물통에 남기고 깨끗한 수증기만 내보냅니다."], ["AI 스마트 모드", "현재 실내 습도를 감지해 가습량을 알아서 조절합니다."], ["대용량 가습", "시간당 최대 600ml, 최대 10시간 연속 사용 가능하며, 3L대용량으로 수면도중 물 채우는 번거로움 없이 가능"], ["자동세척", "가열판의 물때와 미네랄 자국을 스스로 제거"]], "errors": [], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "제품이 동작하지 않아요.", "a": [["확인사항", "→ 전원 코드 상태를 확인한 후, 콘센트에 올바르게 연결해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "전원은 켜졌는데 가습이 제대로 작동하지 않아요.", "a": [["확인사항", "→ 가열식 가습기 특성상 작동 시작 후 물이 끓을 때까지 일정한 시간이 소요됩니다.\n→ 수조 내부의 수위를 확인하여 물을 보충해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "뚜껑이 열리지 않아요.", "a": [["확인사항", "→ PUSH 버튼을 누른 후 뚜껑을 위로 당겨 열어 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "가습이 나오지 않아요.", "a": [["확인사항", "→ 제품 작동 시 MAX 기준으로 약 35분 경과 후 물이 끓기 시작하며, 이때부터 가습이 배출됩니다.\n※ 조건 - 환경 온도: 24℃ | 수온 : 24℃ | 수위 : 최대수위"]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "수조 내부 및 테두리에 얼룩과 침전물이 생겼습니다.", "a": [["확인사항", "→ 스테인리스 표면에 생긴 얼룩 및 침전물은 물이 가열되고 증발하면서 나온 물 속 성분(미네랄, 철분, 칼슘 등)으로 자연스러운 현상이므로 안심하고 사용하셔도 됩니다.\n→ 수조부 세척 방법을 참고하여 세척 후 사용해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "가습기 오일 사용 여부에 대한 응대 가이드 (무드/안개/시그니처/IOT/라인/가열식가습기 공통)", "a": [["대응", "→ 오일패드·트레이 등 전용 장치가 없는 일반 가습기에는 오일 사용이 권장되지 않습니다.\n물에 직접 오일을 넣어 사용할 경우 세척·관리 난이도 증가 및 제품 수명 저하가 발생할 수 있으며, 타사 오일 사용도 지양해 주시면 가습기를 보다 안정적으로 오래 사용하실 수 있습니다. 오일 사용을 원하실 경우 디퓨저형 가습기 또는 오일 전용 패드/트레이가 구성된 제품을 이용해주시기 바랍니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "가습이 눈에 보이지 않아요/약해요 문의시", "a": [["대응", "→ 가열식 가습기는 약 100°C의 뜨거운 수증기를 내보내기 때문에 초음파 가습기처럼 흰 안개가 잘 보이지 않으며, 공기 중에 나오면 바로 기화·확산되므로 가습기의 물이 줄어든다면 정상적으로 가습이 되고 있는 것입니다.\n→ 실내 온도가 높고 습도가 낮을수록 수증기가 더 빠르게 기화되어 눈에 잘 보이지 않을 수 있습니다. 예를 들어, 겨울철에는 따뜻한 실내에서는 입김이 거의 보이지 않지만 차가운 실외에서는 입김이 하얗게 보이는 것과 같은 원리입니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "주전자로 물 끓일 때와 가열식가습기 수증기 양 비교 문의시", "a": [["대응", "→ 물의 끓는 온도는 같더라도 가열 방식·출력(W), 내부 구조, 그리고 수증기가 빠져나오는 토출구의 크기에 따라 눈에 보이는 수증기 밀도가 달라지기 때문입니다. 주전자는 작은 입구로 높은 압력의 수증기가 한 번에 분출되기 때문에 연기가 진하게 보이지만, 가열식 가습기는 넓은 토출구로 뜨거운 수증기가 부드럽게 확산되며 나오기 때문에 공기 중에서 더 빨리 기화되어 눈에 잘 보이지 않을 수 있습니다. 따라서 연기가 크게 보이지 않아도 물 소비량이 줄고 있다면 정상적으로 가습이 이루어지고 있는 상태이니 안심하고 사용하셔도 됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "집에 있는 습도계가 건조하게 표시되는 경우", "a": [["대응", "→ \"본 가열식 가습기는 100℃ 이상의 고온 수증기를 생성합니다.\n하지만 일반 가정용 습도계의 상대습도 센서는 이러한 고온 수증기를 정밀하게 측정하는 데 한계가 있어,\n습도가 건조하게 표시될 수 있습니다. 이는 센서의 특성상 발생하는 정상적인 현상으로, 제품의 이상이 아님을 알려드립니다.\""]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "분사되는 수증기 온도 문의시", "a": [["대응", "→ 가습구 출구 초입은 고온(99℃)의 가습이 토출됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "물이 반만 끓는것처럼 보여 문의하는 경우", "a": [["대응", "→ 열판 가열 방식은 전체를 가열하는 것이 맞습니다. 다만, 열선의 위치에 따라 일부만 가열되는 것처럼 보일 수 있습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "작동 시 외벽 온도 문의시 / 작동 중 외벽에 손을 대어도 되는지 문의시", "a": [["대응", "→ 외부 소재는 PC 이며, 작동 시 외부 온도는 약 45~48℃정도 입니다.\n다만, 사용환경에 따라 온도는 차이가 있을 수 있고 사용자에 따라 체감하는 부분은 상이할 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "처음부터 끓는 물을 넣어서 사용 문의시", "a": [["대응", "→ 처음부터 끓인 물을 넣어 사용하셔도 괜찮습니다. 다만, 뜨거운 물을 붓거나 물통을 옮기는 과정에서 화상이나 파손이 발생하지 않도록 주의해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "환경호르몬이 나오는지 / 실리콘 소재 성적 관련 문의시", "a": [["대응", "→ 본 제품은 RoHS(유해물질 제한 지침)에 따라 유해물질 함량 시험을 완료하였으며, 모든 시험 결과에서 모든 항목이 **불검출(ND, Not Detected)**로 나와 유해물질이 검출되지 않았습니다. 안심하고 사용하셔도 됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "분무구가 PC 소재로 표기되어있는데요. 뜨겁게 끓인 물의 수증기가 통과하는데 BPA나 그 외 유해물질이 함께 방출될 가능성은 없을까요?", "a": [["대응", "→ 본 제품의 분무구는 PC(폴리카보네이트) 소재로 제작되었습니다.\n사용된 원료는 SGS 전문 시험기관에서  비스페놀A(BPA)를 포함한 총 251개 유해 우려 물질 항목에 대한 시험을 진행했으며, 모든 항목에서 불검출 판정을 받았습니다.\nPC 소재는 약 120~130℃ 이상의 내열성을 갖추고 있습니다. 가습기 작동 시 발생하는 증기의 온도는 소재의 내열 온도보다 낮아 장시간 사용 시에도 변형에 대한 우려 없이 안심하고 사용하실 수 있습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "넘어짐 감지 기능이 있나요? / 물이 안새나요? / 넘어지면 물이 새어나오나요", "a": [["대응", "→ 넘어지면 수조가 자동 분리 되면서 전원이 차단되나, 뚜껑에서 물이 흘러나와 위험할 수 있습니다. 적절한 위치에 설치하여 사용해주시길 바랍니다. 또한, 혹여라도 제품이 넘어졌을 때 물이 한꺼번에 쏟아지는 것을 방지하기 위하여 반드시 뚜껑을 닫은 후 PUSH 버튼을 눌러 잠금 상태로 고정해 주어야 합니다. (단, 물이 새어 나오는 것을 완전히 방지하는 것은 아닙니다.)"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "단계별 소비전력이 어떻게 되나요", "a": [["대응", "→ L단 : 130W~330W - M단 : 150W~350W - H단 : 170W~430W이며, 안내드린 범위 내에서 변동되어 작동하는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "실리콘 고무패킹이 부식되진 않나요?", "a": [["대응", "→ 본 제품에 사용된 실리콘 고무패킹의 내열온도는 약 160~200℃로, 고온에서도 사용할 수 있는 내열성 소재로 제작되었습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "처음 켤때부터 ai모드 켜놓고 끓여도 되는건가요? 어느 방법이 전력소비적에 효율적일까요??", "a": [["대응", "→ AI 모드는 물이 끓기 전부터 사용 가능하며, 반드시 물이 끓은 후 전환하실 필요는 없습니다.\n본 제품은 L/M/H 모드 모두 물 끓임까지 약 33~36분 소요되며, AI 모드는 주변 습도에 따라 자동으로 작동이 조절됩니다.\n전력 소비 측면에서는 주변 습도가 40% 이상인 경우 처음부터 AI 모드로 사용하는 것이 상대적으로 효율적일 수 있습니다.\n다만 실제 전력 소비량은 주변 습도 및 사용 환경에 따라 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "AI 모드를 원하는 습도로 설정할 수 있나요? 습도 도달시 작동을 멈추나요?", "a": [["대응", "→ AI 스마트 모드는 주변 습도에 따라 가습량이 자동으로 조절되는 기능으로, 원하시는 습도로 설정하기는 어렵습니다.\n습도 60% 이상에서는 1단계로 작동하며, 습도가 높아져도 가습이 자동으로 멈추지는 않는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "수돗물로 사용시 침전물/이물질 발생 원인 문의시", "a": [["원인", "→ 칼슘·마그네슘 같은 미네랄 성분이 정수물에 비해 상대적으로 많다보니, 가열되면서 물은 증발하고 미네랄만 남아 미네랄가루/침전물이 쌓이면서 남아 있는 잔열로 인해 갈색으로 변하게 됩니다."], ["대응", "→ 수돗물 보다는 정수물 사용 시 상대적으로 줄어들며, 쉽게 세척이 가능합니다.\n→ [세척방법]\n1. 구연산을 소량 넣고 10~15분 정도 끓이고, 전원을 끈 뒤 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "정수물로 사용해도 침전물/이물질이 있다는 문의시", "a": [["대응", "→ 정수 과정에서 칼슘·마그네슘 등 미네랄이 일부 제거되지만, 완전히 제거되는 것은 아니기 때문에 가열과정에서 미네랄이 증발 후 가열판에 소량 침전될 수 있습니다.\n→ 정수기 종류, 필터 상태, 사용 물량과 사용 빈도, 지역 수질 차이에 따라 침전물 발생량에 차이가 있을 수 있습니다."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "수조부 내부 스테인레스 표면의 녹으로 인입  / 검은색(갈색) 반점 또는 곰팡이로 인입 / 눌러붙은 이물질 제거 방법 문의", "a": [["대응", "→ 물에 포함된 미네랄 성분이 스테인리스 표면에 흡착된 뒤 제거되지 않아, 제품을 계속 사용하면서 그 부분에 그을림처럼 보이는 흔적이 생긴 것일 수 있습니다. 즉, 녹이 아니라 미네랄 잔여물로 인한 그을림 현상일 가능성이 있습니다.\n→ 실제 녹이라면 세척으로 제거가 되지 않기에 아래 세척 방법을 통해 지워지는지 확인해주시길 바랍니다.\n→ [세척방법]\n1. 구연산을 소량 넣고 10~15분 정도 끓이고, 전원을 끈 뒤 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": true}, {"group": "세척/ 관리 관련", "q": "수조부 내부 스테인리스에 무지개 빛 혹은 흰 반점 발생되어 인입되는 경우", "a": [["대응", "→ 전기포트 가열판 혹은 멀티쿠커 냄비와 같이 수조통이 무지개빛 혹은 흰 반점이 생길 수 있음\n → 이는 스테인레스 특성상 물 속 미네랄 성분에 의한 현상으로 세척 후 사용.\n → 키친타올에 식초를 뭍여 얼룩이 있는곳에 덮고 2~3분 정도 방치를 하고 닦아내는 방법과 구연산을 소량 넣고 끊이면 제거됨."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "수조부 내부의 세척 시 철수세미 사용 가능한지 문의시", "a": [["대응", "→ 표면에 스크래치가 발생될 경우, 추후 녹씀 현상이 발생될 수 있어 스테인레스 스틸 표면을 닦을 때는 부드러운 천이나 스펀지를 사용하여 표면이 긁히지 않도록 세척 및 관리 권장"]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "가열판 연마제 제거 방법 / 스테인리스 (스테인레스, SUS,스텐 )부분 연마제 제거 방법 문의시", "a": [["대응", "1. 새 제품을 구매한 후 물로 씻지 않은 상태에서 키친타월에 식용유를 묻혀 가열판 및 스테인리스부분을 구석구석을 닦아줍니다. (약 3~4회 반복)\n2. 베이킹소다를 소량 넣고 물을 끓인 뒤, 끓는 상태에서 약 5분 정도 그대로 둡니다. (물을 가득 넣지 마세요.)\n3. 물을 버리고 키친타월에 식초를 묻혀 구석구석 닦아내 주세요.\n4. 위 단계를 모두 거친 후 마지막으로 깨끗한 물로 충분히 헹궈 세척해 주세요."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "자동세척시 물의 양은 어느정도 넣어야 하나요", "a": [["대응", "→ 자동세척 모드 사용 시 수조 내부의 오염된 부위가 충분히 잠길 수 있도록 물을 채워주시되, 최소 500ml 이상 넣어 사용해 주시기 바랍니다. 반드시 MAX 수위까지 물을 채우실 필요는 없으며, 오염된 부위에 맞춰 물의 양을 조절하여 사용해 주시면 됩니다."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "자동세척할 때 구연산을 함께 넣어도 건강에 문제가 없을까요?", "a": [["대응", "→ 구연산은 휘발성이 낮아 물처럼 쉽게 기화하지는 않습니다. 우려되신다면 자동 세척 기능으로 물을 끓인 후, 구연산을 넣고 약 30분간 불려 세척하는 방법을 권장드립니다.구연산을 넣고 가열하시는 경우에는 환기가 잘되는 공간에서 이용해 주시고, 세척이 완료된 후에는 내부를 깨끗한 물로 충분히 헹군 뒤 사용해 주시기 바랍니다."]], "notes": [], "media": false}, {"group": "기타", "q": "투명 외관 테두리 (모서리)가 깨져있어요 / 수조가 울퉁불퉁해요", "a": [["대응", "→ 해당 부분은 제조 과정에서 금형 특성상 발생할 수 있는 현상이며, 제품이 깨진 자국은 아닙니다. 제품 사용에는 문제가 없는 부분이니 안심하고 사용해 주세요."]], "notes": [], "media": true}, {"group": "기타", "q": "수조부 고정틀이 파손되어 있어요 / 파여있어요", "a": [["대응", "→ 해당 부분은 제조 과정에서 금 n·  잠금 상태에서 다시 길게 누르면 잠금이 해제됩니다."], ["무드등 버튼", "·  무드등 버튼을 짧게 터치 시 무드등 ON/OFF 설정이 가능합니다.\n·  무드등이 켜진 상태에서 짧게 누르면 전구색 2단계 / 주광색 2단계로 설정 가능합니다.\n·  무드등은 단독 사용이 가능합니다."], ["세척 버튼", "·  누적 20시간 작동 시 무드등/세척 알림 버튼 상단에 표시등이 깜빡이며 물통 세척을 알립니다.\n·  세척 후 세척 알림 버튼을 길게 누르면 알림이 꺼지고 타이머가 초기화됩니다."], ["#", "리모컨 사용 방법"], ["전원 버튼", "·  버튼을 누르면 기기 전체의 전원이 켜집니다.\n·  작동 중 버튼을 짧게 누르면 기기 작동이 중지됩니다."], ["가습 조절 버튼", "·  전원이 켜지면 기본적으로 3단계(강)로 시작합니다.\n·  버튼을 누를 때마다 3단 (초기값) → A (자동 모드) → 1단 → 2단 → 3단 순서로 순환됩니다."], ["타이머 버튼", "·  버튼을 누르면 타이머가 활성화되며, 누를 때마다 아래 순서대로 작동 시간이 변경됩니다.\n·  2H → 4H → 6H (2+4) → 8H → 10H (2+8) → 12H (4+8) → 14H (2+4+8) → 종료(Exit) → 반복 순환 됩니다."], ["잠금  버튼", "·  버튼을 누르면 잠금 상태로 진입합니다. 잠금 상태에서는 전원 버튼을 제외한 다른 버튼을 눌러도 반응하지 않습니다\n·  잠금 상태에서 다시 버튼을 누르면 잠금이 해제됩니다."], ["무드등 버튼", "·  무드등 버튼을 눌러 무드등 ON/OFF 설정이 가능합니다.\n·  무드등이 켜진 상태에서 버튼을 누르면 전구색 2단계 / 주광색 2단계로 설정 가능합니다.\n·  무드등은 단독 사용이 가능합니다."], ["세척 버튼", "·  누적 20시간 작동 시 무드등/세척 알림 버튼 상단에 표시등이 깜빡이며 물통 세척을 알립니다.\n·  세척 후 세척 알림 버튼을 길게 누르면 알림이 꺼지고 타이머가 초기화됩니다."]], "notes": []}], "clean": [{"title": "세척 및 관리방법", "items": [["", "※ 제품 세척 시 화학약품이 포함된 물티슈, 알코올, 벤젠 등 화학 용제는 사용하지 마세요.\n※ 수조부의 물이 오래될 경우 세균 번식으로 인하여, 불쾌한 냄새가 나거나 건강에 안 좋은 영향을 줄 수 있습니다. 가습에 사용되는 물은 반드시 매일 깨끗한 물로 교체하여 주시고, 2~3일에 한번 수조부 세척해 주시기 바랍니다. 제품의 올바른 사용을 위하여 꾸준히 세척하여 위생적으로 사용해 주시기 바랍니다."], ["본품 청소 방법", "·  본품 외부 및 내부 오염, 이염이 되었을 경우 부드러운 천에 소량의 물을 적셔, 가볍게 닦아낸 후 마른 헝겊, 천 등을 사용해 물기를 제거해 주십시오."], ["상/하단 수조부 세척 방법", "※ 누적 20시간 작동 시 무드등/세척 알림 버튼 상단에 표시등이 깜빡이며 물통 세척을 알립니다.\n※ 청소 완료 후 청소 알림 버튼을 길게 누르면 알림이 꺼지고 타이머가 초기화됩니다.\n·  청소 전 반드시 전원을 분리해 주세요.\n·  본체와 상/하단 수조부를 분리해 주세요. 상/하단 수조부에 남아있는 물을 비워 주세요.\n·  상/하단 수조부에 따듯한 물 1L에 구연산 50g 비율로 녹인 물을 넣어 주세요.\n·  30분 정도 경과 후 깨끗한 물로 헹구어 닦아 주세요.\n·  세척 후에는 충분히 건조하여 사용/보관해 주세요."], ["뚜껑 청소 방법", "·  청소 전 반드시 전원을 분리해 주세요.\n·  상단 뚜껑을 돌려 분리해 주세요.\n\n·  뚜껑 하단 가습구 부분을 돌려서 분리해 주세요.\n\n·  뚜껑은 오염, 이염이 되었을 경우 부드러운 천에 소량의 물을 적셔, 가볍게 닦아낸 후 마른 헝겊, 천 등을 사용해 물기를 제거해 주세요.\n·  가습구, 뚜껑 하단 부분, 실리콘 링은 중성세제를 사용하여 물로 가볍게 세척해 주세요.\n·  물기를 털고, 통풍이 잘 되는 곳에서 건조시켜 주세요.\n·  건조 완료 후 분해한 역순으로 재조립하여 사용해 주세요.\n\n※ 뚜껑 전체를 물에 담그면 내부로 물이 스며들 수 있습니다.\n※ 실리콘 링은 분리되지 않으므로 세척 시 주의해 주세요."]], "notes": []}], "features": [["", "넓은 거실을 채우는\n가열식 수증기"], ["", "가열식 미세 수증기가 높은 곳에서 공기를 타고 퍼져, 40~60m2 넓은 공간까지 촉촉하게! 약 2평(6.6m2) 공간은 단 14분 만에 빠르게 채워줍니다. ※ 자가테스트 진행 (3단 모드 / 약 2평 공간 기준)"], ["자동 수위 감지", "자동 수위 감지로 채우고, 가열은 더 빠르게, 3분 급수, 7분 가열로 총 약 10분이면 준비됩니다.\n※ 실제 주변 사용 환경과 초기 수온에 따라 도달 시간은 차이가 있을 수 있습니다.\n※ 수위 제어 기준 : 자동 급수 시작 0.7L 미만 → 자동 급수 정지 1.0L 도달\n※ 자동 급수 수위는 제품에 설정된 기준으로 작동하며, 사용자가 임의로 변경할 수 없습니다.\n※ 0.7L / 1.0L 는 상부 가열부의 급수 제어를 위한 수위 기준이며, 1회 급수량을 의미하지 않습니다."], ["순수한 수증기", "스팀 이물질 테스트 결과, 이물질 ZERO! 순수 증기만"], ["스마트한 AI 모드", "공간의 습도를 감지하는 습도 센서. 제품 뒷면 전원 코드선에 위치한 습도 센서가 주변 습도를 감지해 가습량을 자동으로 조절합니다."], ["안심되는 프리미엄 소재", "가열부 : 일반 스테인리스 보다 우수한 내구성과 부식에 강한 스테인리스 SUS316를 적용해 더욱 안심할 수 있습니다.\n상부 수조 : 고온에 강한 내열 붕규산 유리와 불이 쉽게 번지지 않는 난연 ABS 소재(UL 94 V-0 등급)를 적용해 더욱 안심할 수 있습니다."]], "errors": [], "staffSpec": [], "qa": [{"group": "설명서·상세 FAQ", "q": "제품이 동작하지 않아요.", "a": [["확인사항", "→ 전원 코드 상태를 확인한 후, 콘센트에 올바르게 연결해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "전원은 켜졌는데 가습이 제대로 작동하지 않아요.", "a": [["확인사항", "→ 가열식 가습기 특성상 작동 시작 후 물이 끓을 때까지 일정한 시간이 소요됩니다.\n→ 수위를 확인한 후 물을 보충해 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "상단 수조부가 빠지지 않아요.", "a": [["확인사항", "→ 상단 수조부 분리 버튼을 눌러 잠금 해제 후 손잡이를 잡고 위로 당겨 주세요."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "가습이 나오지 않아요.", "a": [["확인사항", "→ 제품 작동 후 물이 끓기까지 약 10분이 소요되며, 이후부터 가습이 정상 배출됩니다.\n※ 조건 - 환경 온도: 24℃ | 수온 : 24℃ | 수위 : 최대수위\n※ 사용 환경에 따라 소요되는 시간이 다를 수 있습니다."]], "notes": [], "media": false}, {"group": "설명서·상세 FAQ", "q": "수조 내부 및 테두리에 얼룩과 침전물이 생겼습니다.", "a": [["확인사항", "→ 스테인리스 표면에 생긴 얼룩 및 침전물은 물이 가열되고 증발하면서 나온 물 속 성분(미네랄, 철분, 칼슘 등)으로 자연스러운 현상이므로 안심하고 사용하셔도 됩니다.\n→ 수조부 세척 방법을 참고하여 세척 후 사용해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "가습기 오일 사용 여부에 대한 응대 가이드 (무드/안개/시그니처/IOT/라인가습기 공통)", "a": [["대응", "→ 오일패드·트레이 등 전용 장치가 없는 일반 가습기에는 오일 사용이 권장되지 않습니다.\n물에 직접 오일을 넣어 사용할 경우 세척·관리 난이도 증가 및 제품 수명 저하가 발생할 수 있으며, 타사 오일 사용도 지양해 주시면 가습기를 보다 안정적으로 오래 사용하실 수 있습니다. 오일 사용을 원하실 경우 디퓨저형 가습기 또는 오일 전용 패드/트레이가 구성된 제품을 이용해주시기 바랍니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "가습이 눈에 보이지 않아요/약해요 문의시", "a": [["대응", "→ 가열식 가습기는 약 100°C의 뜨거운 수증기를 내보내기 때문에 초음파 가습기처럼 흰 안개가 잘 보이지 않으며, 공기 중에 나오면 바로 기화·확산되므로 가습기의 물이 줄어든다면 정상적으로 가습이 되고 있는 것입니다.\n→ 실내 온도가 높고 습도가 낮을수록 수증기가 더 빠르게 기화되어 눈에 잘 보이지 않을 수 있습니다. 예를 들어, 겨울철에는 따뜻한 실내에서는 입김이 거의 보이지 않지만 차가운 실외에서는 입김이 하얗게 보이는 것과 같은 원리입니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "주전자로 물 끓일 때와 가열식가습기 수증기 양 비교 문의시", "a": [["대응", "→ 물의 끓는 온도는 같더라도 가열 방식·출력(W), 내부 구조, 그리고 수증기가 빠져나오는 토출구의 크기에 따라 눈에 보이는 수증기 밀도가 달라지기 때문입니다. 주전자는 작은 입구로 높은 압력의 수증기가 한 번에 분출되기 때문에 연기가 진하게 보이지만, 가열식 가습기는 넓은 토출구로 뜨거운 수증기가 부드럽게 확산되며 나오기 때문에 공기 중에서 더 빨리 기화되어 눈에 잘 보이지 않을 수 있습니다. 따라서 연기가 크게 보이지 않아도 물 소비량이 줄고 있다면 정상적으로 가습이 이루어지고 있는 상태이니 안심하고 사용하셔도 됩니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "집에 있는 습도계가 건조하게 표시되는 경우", "a": [["대응", "→ \"본 가열식 가습기는 100℃ 이상의 고온 수증기를 생성합니다.\n하지만 일반 가정용 습도계의 상대습도 센서는 이러한 고온 수증기를 정밀하게 측정하는 데 한계가 있어,\n습도가 건조하게 표시될 수 있습니다. 이는 센서의 특성상 발생하는 정상적인 현상으로, 제품의 이상이 아님을 알려드립니다.\""]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "전원은 들어오는데 물이 안올라와요 / 물 공급이 안돼요", "a": [["대응", "→ 4개의 모터 부품이 모두 있는지 확인 필요\n → 부품을 분해하여 이물질이 있는지 확인 필요"]], "notes": [], "media": true}, {"group": "제품 ·사용 관련", "q": "모터만 따로 구매할 수 있나요 ? / 물 공급이 안되는데 모터만 구매할 수 있나요?", "a": [["대응", "→ 모터는 별도 판매하지 않는 부품입니다. 물 공급이 원활하지 않은 경우 모터 외 다른 원인일 수도 있어, 부품을 교체하기보다는 AS 접수를 통해 제품 상태를 확인해 주시길 권장드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "본체에 매달린 하얀 호스(투명 호스 / 물 빨아들이는 호스)를 별도로 구매할 수 있나요? /", "a": [["대응", "→ [보아르플로업가열식가습기13L-모터연결호스] 소모품 구매 가능"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "상단 수조에 물을 반만 채워져요 / 상단 수조 MAX까지 물이 채워지지 않아요", "a": [["대응", "→ 수조에 물이 없는 상태에서 작동을 시작하면 약 1L까지 자동으로 급수됩니다.\n물은 하부 수조에 급수해 주세요. 상단 수조부에 직접 물을 붓는 것은 권장하지 않습니다. 또한, 안전하고 원활한 사용을 위해 상단 수조부의 MAX 표시선을 넘지 않도록 물을 채워 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "물이 어느정도 소진되어야 다시 채우나요?", "a": [["대응", "→ 수조의 물이 약 700mL까지 줄어들면 자동으로 약 1L까지 다시 채워집니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "상단 수조에 1L 물 공급까지 소요되는 시간 문의 시", "a": [["대응", "→ 물을 채우는 데 약 3분이 소요되며, 연속으로 급수되는 방식이 아니라 물 공급과 일시 정지를 반복하며 채워집니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "상단 수조의 남은 물을 버릴때 뒤어나온 실리콘 부분 쪽으로 물을 버려도 되나요? / 상단 수조 물버리는 방향이 있나요?", "a": [["대응", "→ 정해진 잔수 배출 방향은 없습니다. 뚜껑을 열고 원하는 방향으로 배출해 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "리모컨으로 작동이 안돼요", "a": [["대응", "→ 본체 버튼이 있는 정면을 향해 리모컨을 조작해 주셔야 합니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "전기세 문의 시", "a": [["대응", "→ 문의주신 전기요금은 하루 8시간, 1단 모드 사용 기준 약 450원입니다. (자사 테스트 기준)\n해당 금액은 주택용 전력(고압) 기준이며, 누진세 및 기본요금 등은 포함되지 않았습니다. 실제 전기요금은 사용 환경과 누진 구간에 따라 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "상단 수조로 물을 직접 넣어도 되나요?", "a": [["대응", "→ 물은 하부 수조에 급수해 주세요. 상단 수조부에 직접 물을 붓는 것은 권장하지 않습니다. 또한, 안전하고 원활한 사용을 위해 상단 수조부의 MAX 표시선을 넘지 않도록 물을 채워 주세요."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "분사 온도가 어떻게 되나요?", "a": [["대응", "→ 문의해주신 제품은 수조의 물을 100도로 가열한 후, 살균된 순수한 증기를 분사하는 가열식 가습기입니다. 가열된 증기가 분사되는 특성상 분무구 출구 초입 온도는 약 99도이나 토출된 증기가 공기 중으로 퍼지는 과정에서 실내 온도나 습도 등 주변 환경에 따라 실제 분사 및 체감 온도가 달라질 수 있는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "뜨겁게 끓인 물의 수증기가 통과하는데 환경호르몬이나 미세플라스틱에 안전할까요?", "a": [["대응", "→ 해당 제품은 전기·전자제품의 유해물질 사용을 제한하는 EU RoHS 2.0 기준에 부합하는 제품입니다.\n공인시험기관에서 제품을 구성하는 부품 전체를 분해하여 시험했으며, 납·수은·카드뮴 등 중금속 4종, 난연제 2종, 프탈레이트 4종 등 총 10종의 유해물질이 기준치 이내임을 확인했습니다.\n분무구 PP 소재는 일반적으로 약 100~120℃ 수준의 내열성을 갖추고 있으며, 가습기 작동 시 발생하는 증기의 온도는 PP소재의 내열 온도보다 낮아 장시간 사용 시에도 변형에 대한 우려 없이 안심하고 사용하실 수 있습니다."], ["", "→"]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "전자제품, 원목가구 등에 가까이 두고 사용해도 되나요?", "a": [["대응", "→ 가열된 증기가 분사되는 가열식 가습기 특성상 열이나 수분에 의해 변형될 수 있는 가구, 벽지, 전자제품과 가까이 두고 사용하시는 것을 권장하지 않습니다. 주변 환경과 가구 보호를 위해 충분한 거리를 두고 사용해 주시길 권장드립니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "AI모드 사용할 때 습도가 높으면 작동을 멈췄다가 건조해지면 재가동하는 방식일까요?", "a": [["대응", "→ AI 모드는 주변 습도에 따라 가습량이 자동 조절됩니다. 현재 습도 60% 이상은 1단, 40~60%는 2단, 40% 미만은 3단으로 작동하며, 습도가 높아져도 작동이 멈추지는 않습니다."]], "notes": [], "media": false}, {"group": "제품 ·사용 관련", "q": "Ai모드는 원하는 습도를 설정할수 없나요? A와 3번에 불이들어와있는상태로 계속 유지됩니다", "a": [["대응", "→ AI 모드는 원하는 습도를 직접 설정하는 기능이 아닌, 주변 습도에 따라 가습량을 자동으로 조절하는 기능입니다. 현재 A와 3번에 불이 들어와 있다면, 주변 습도가 40% 미만으로 감지되어 3단으로 가습 중인 상태입니다. 주변 습도가 높아지면 가습량도 자동으로 조절되는 점 참고 부탁드립니다."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "수돗물로 사용시 침전물/이물질 발생 원인 문의시", "a": [["원인", "→ 칼슘·마그네슘 같은 미네랄 성분이 정수물에 비해 상대적으로 많다보니, 가열되면서 물은 증발하고 미네랄만 남아 미네랄가루/침전물이 쌓이면서 남아 있는 잔열로 인해 갈색으로 변하게 됩니다."], ["대응", "→ 수돗물 보다는 정수물 사용 시 상대적으로 줄어들며, 쉽게 세척이 가능합니다.\n→ 세척방법\n1. 구연산을 소량 넣고 10~15분 정도 끓이고, 전원을 끈 뒤 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "정수물로 사용해도 침전물/이물질이 있다는 문의시", "a": [["대응", "→ 정수 과정에서 칼슘·마그네슘 등 미네랄이 일부 제거되지만, 완전히 제거되는 것은 아니기 때문에 가열과정에서 미네랄이 증발 후 가열판에 소량 침전될 수 있습니다.\n→ 정수기 종류, 필터 상태, 사용 물량과 사용 빈도, 지역 수질 차이에 따라 침전물 발생량에 차이가 있을 수 있습니다."]], "notes": [], "media": false}, {"group": "세척/ 관리 관련", "q": "수조부 내부 스테인레스 표면의 녹으로 인입  / 검은색(갈색) 반점 또는 곰팡이로 인입 / 눌러붙은 이물질 제거 방법 문의", "a": [["대응", "→ 물에 포함된 미네랄 성분이 스테인리스 표면에 흡착된 뒤 제거되지 않아, 제품을 계속 사용하면서 그 부분에 그을림처럼 보이는 흔적이 생긴 것일 수 있습니다. 즉, 녹이 아니라 미네랄 잔여물로 인한 그을림 현상일 가능성이 있습니다.\n→ 실제 녹이라면 세척으로 제거가 되지 않기에 아래 세척 방법을 통해 지워지는지 확인해주시길 바랍니다.\n→ 세척방법\n1. 구연산을 소량 넣고 10~15분 정도 끓이고, 전원을 끈 뒤 10분 정도 방치 후 부드러운 수세미로 닦아 부드럽게 제거해 주세요.\n2. 오염이 심하거나, 얼룩이 남은 경우 키친타월에 식초를 적셔 얼룩이 있는 부분에 덮어 2~3분 정도 방치 후 닦아내어 주세요.\n3. 세척 후 깨끗한 물로 충분히 헹구고 물기 제거해 주세요. (필요에 따라 1~2회 반복)"]], "notes": [], "media": true}, {"group": "세척/ 관리 관련", "q": "수조부 내부 스테인리스에 무지개 빛 혹은 흰 반점 발생되어
