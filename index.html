const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let terms = [];
function hl(s){ let h = esc(s); if(!terms.length) return h;
  const flat = [...new Set(terms.flat())].filter(Boolean).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  return h.replace(new RegExp("(" + flat.join("|") + ")","gi"), "<mark>$1</mark>"); }
function expand(tok){ const t = tok.toLowerCase(); const g = SYN.find(g => g.some(w => t.includes(w.toLowerCase()) || w.toLowerCase().includes(t) && t.length>=2));
  return g ? [tok, ...g] : [tok]; }

/* ---------- search index ---------- */
const IDX = [];
P.forEach(p => {
  p.qa.forEach((q,i) => IDX.push({p, kind:"qa", i, title:q.q, body:q.a.map(a=>a[1]).join(" ") + " " + q.notes.join(" ")}));
  [...p.basic, ...p.spec].forEach(([k,v]) => IDX.push({p, kind:"spec", title:k, body:v}));
  p.features.forEach(([k,v]) => IDX.push({p, kind:"intro", title:k || "제품 특징", body:v}));
  p.caution.forEach(c => IDX.push({p, kind:"intro", title:"꼭 함께 안내", body:c}));
  p.usage.forEach(s => s.items.forEach(([k,v]) => { if(k==="__table") IDX.push({p, kind:"use", title:v.title||s.title, body:v.rows.flat().join(" ")});
      else if(k!=="#") IDX.push({p, kind:"use", title:k || s.title, body:v}); }));
  p.clean.forEach(s => s.items.forEach(([k,v]) => IDX.push({p, kind:"clean", title:k || s.title, body:v})));
  p.errors.forEach(([k,v]) => IDX.push({p, kind:"use", title:"오류 " + k, body:v}));
  const S = p.sales;
  S.top5.forEach(([q,a,n]) => IDX.push({p, kind:"sales", title:q, body:a + (n?" "+n:"")}));
  S.points.forEach(([k,v]) => IDX.push({p, kind:"sales", title:k, body:v}));
  S.hero.forEach(([k,v]) => IDX.push({p, kind:"sales", title:k, body:v}));
  S.persona.forEach(([w,l]) => IDX.push({p, kind:"sales", title:w + " 한 마디", body:l}));
});
const KIND = {sales:"판매 화법", qa:"Q&A", spec:"스펙", intro:"소개", use:"사용법", clean:"세척"};

function search(qs, only){
  const toks = qs.trim().split(/\s+/).filter(Boolean);
  terms = toks.map(expand);
  const names = only ? [] : P.filter(p => toks.some(t => (p.name + p.full).replace(/\s/g,"").includes(t.replace(/\s/g,""))));
  const res = [];
  for(const it of IDX){
    if(only && it.p !== only) continue;
    const T = it.title.toLowerCase(), B = it.body.toLowerCase(), N = it.p.name.replace(/\s/g,"");
    let score = 0, ok = true;
    for(const g of terms){
      const o = g[0].toLowerCase();
      const inN = g.some(w => N.includes(w.replace(/\s/g,"")));
      const inT = g.some(w => T.includes(w.toLowerCase())), inB = g.some(w => B.includes(w.toLowerCase()));
      if(!(inT||inB||inN)){ ok=false; break; }
      score += T.includes(o) ? 10 : inT ? 4 : B.includes(o) ? 3 : inB ? 1 : 0; if(inN) score += 1;
    }
    if(ok && score>1) res.push({...it, score: score + (it.kind==="qa" ? 1 : 0)});
  }
  res.sort((a,b)=>b.score-a.score);
  return {names, res: res.slice(0,60)};
}

  <section class="phead"><span class="catn">고객 유형별 한 마디</span><h1>${esc(w)}</h1><span class="tag">제품을 누르면 판매 화법 전체를 볼 수 있습니다.</span></section>
  <div class="chips">${DATA.personas.map((x,j)=>`<button class="chip" data-persona="${j}" aria-pressed="${j==i}">${esc(x)}</button>`).join("")}</div>
  ${CATS.map(([c,n]) => `<section class="cat"><h2 class="sec">${n}</h2><div class="plist lines">${P.filter(p=>p.cat===c).map(p=>{ const r = p.sales.persona.find(x=>x[0]===w);
    return `<button class="prow" data-open="${p.id}"><span class="n">${esc(p.name)}</span><span class="p">${esc(p.price)}</span><span class="t">“${esc(r[1])}”${r[2]?`<br><span class="muted small">${esc(r[2])}</span>`:""}</span></button>`; }).join("")}</div></section>`).join("")}
  ${footer()}`;
}

function renderChecks(){
  terms=[];
  $("#view").innerHTML = `<button class="back" data-go="home">← 전체 제품</button>
  <section class="phead"><span class="catn">기술서 검수</span><h1>확인이 필요한 내용</h1><span class="tag">시트끼리 내용이 다르거나 오타로 보이는 부분입니다. 확정되면 시트를 고친 뒤 앱에 다시 반영합니다.</span></section>
  ${P.filter(p=>p.checks.length).map(p=>`<div class="card checks"><h3><button class="back" style="color:inherit;padding:0" data-open="${p.id}">${esc(p.name)} →</button></h3><ul>${p.checks.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`).join("")}
  ${footer()}`;
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash.slice(1); const qs = $("#q").value.trim();
  if(qs) return renderSearch(qs);
  if(h.startsWith("p-")) return renderProduct(h.slice(2));
  if(h.startsWith("compare-")) return renderCompare(h.slice(8));
  if(h==="checks") return renderChecks();
  if(h.startsWith("persona-")) return renderPersona(+h.slice(8));
  renderHome();
}
function go(hash){ if(location.hash.slice(1)===hash){ route(); } else { location.hash = hash; } scrollTo({top:0}); }
addEventListener("hashchange", ()=>{ route(); });

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="homeBtn"){ $("#q").value=""; $("#qclear").hidden=true; state={ps:"",tab:"sales",open:null,qf:"",qg:""}; go(""); return; }
  if(b.dataset.quick){ $("#q").value=b.dataset.quick; $("#qclear").hidden=false; route(); scrollTo({top:0}); return; }
  if(b.dataset.open){ const t=b.dataset.tab; state={ps:"", tab:t||"sales", open:b.dataset.q!=null?+b.dataset.q:null, qf:"", qg:""};
    if(b.classList.contains("ritem")) terms = terms; else terms=[];
    const keep = $("#q").value; $("#q").value=""; $("#qclear").hidden=true;
    if(b.classList.contains("ritem")) terms = keep.trim().split(/\s+/).filter(Boolean).map(expand);
    const hash="p-"+b.dataset.open; if(location.hash.slice(1)===hash) renderProduct(b.dataset.open); else { location.hash=hash; }
    if(state.open==null) scrollTo({top:0}); return; }
  if(b.dataset.cmp){ go("compare-"+b.dataset.cmp); return; }
  if(b.dataset.persona!=null){ go("persona-"+b.dataset.persona); return; }
  if(b.dataset.go){ $("#q").value=""; $("#qclear").hidden=true; go(b.dataset.go==="home"?"":b.dataset.go); return; }
  if(b.dataset.ptab){ const keep = state.ps; state.tab=b.dataset.ptab; state.open=b.dataset.q!=null?+b.dataset.q:null; state.ps=""; state.qg=""; state.jump=true;
    terms = keep.trim().split(/\s+/).filter(Boolean).map(expand); renderProduct(location.hash.slice(3)); return; }
  if(b.dataset.tab && !b.dataset.open){ state.ps=""; state.tab=b.dataset.tab; state.open=null; terms=[]; renderProduct(location.hash.slice(3));
    const tb=$(".tabs"); if(tb && tb.getBoundingClientRect().top < 0) scrollTo({top: $(".tabs").offsetTop - 10}); return; }
  if(b.dataset.qg!=null){ state.qg=b.dataset.qg; $("#tabbody").innerHTML = tabBody(BY[location.hash.slice(3)]); return; }
  if(b.id==="qclear"){ $("#q").value=""; b.hidden=true; route(); $("#q").focus(); }
});
document.addEventListener("input", e => {
  if(e.target.id==="q"){ $("#qclear").hidden = !e.target.value; route(); }
  if(e.target.id==="ps"){ state.ps=e.target.value; const p=BY[location.hash.slice(3)]; if(!state.ps.trim()) terms=[];
    $("#tabbody").innerHTML = tabBody(p); document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected", String(!state.ps.trim() && x.dataset.tab===state.tab))); return; }
  if(e.target.id==="qf"){ state.qf=e.target.value; const p=BY[location.hash.slice(3)];
    const pos=e.target.selectionStart; $("#tabbody").innerHTML = tabBody(p); const n=$("#qf"); n.focus(); n.setSelectionRange(pos,pos); }
});
addEventListener("resize", headerH);
headerH(); route();
</script>

</body></html>
